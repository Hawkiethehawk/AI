ocumented\",\n      \"validation_status\": \"requires_grain_specific_denominator\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\"]\n    },\n    \"sort_price\": {\n      \"source_columns\": [\"价格\"],\n      \"display_name\": \"排序价格\",\n      \"semantic_name_en\": \"waterfall_sort_price\",\n      \"kind\": \"metric\",\n      \"data_type\": \"currency_per_thousand_impressions_or_bidding_label\",\n      \"aggregation\": \"none\",\n      \"definition\": \"常规广告源用于瀑布流排序的人工价格；竞价广告源显示为竞价，不代表固定成交价。\",\n      \"documentation_status\": \"documented\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\"]\n    },\n    \"ecpm_api\": {\n      \"source_columns\": [\"eCPM API\"],\n      \"display_name\": \"eCPM API\",\n      \"semantic_name_en\": \"third_party_reported_ecpm\",\n      \"kind\": \"metric\",\n      \"data_type\": \"currency_per_thousand_impressions\",\n      \"aggregation\": \"recompute_from_revenue_api_and_impressions_api\",\n      \"formula\": \"revenue_api / impressions_api * 1000\",\n      \"definition\": \"第三方广告平台 API 收益除以展示 API 并乘以 1000。复用同一第三方广告位 ID 时不能跨分组简单汇总。\",\n      \"documentation_status\": \"documented\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\"]\n    },\n    \"request_or_bid\": {\n      \"source_columns\": [\"请求/竞价\"],\n      \"display_name\": \"请求/竞价\",\n      \"semantic_name_en\": \"request_or_bid_count_by_source_type\",\n      \"kind\": \"metric\",\n      \"data_type\": \"number\",\n      \"aggregation\": \"sum_only_after_separating_bidding_and_waterfall_sources\",\n      \"definition\": \"聚合管理按广告源类型显示请求或竞价次数的混合列。竞价广告源通常表示竞价次数，常规广告源表示请求次数。\",\n      \"documentation_status\": \"export_column_requires_source_type\",\n      \"validation_status\": \"requires_source_type_context\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\", \"https://help.toponad.net/cn/docs/dfnwQG\"]\n    },\n    \"fill_latency_seconds\": {\n      \"source_columns\": [\"填充耗时（秒）\"],\n      \"display_name\": \"填充耗时（秒）\",\n      \"semantic_name_en\": \"average_fill_latency_seconds\",\n      \"kind\": \"metric\",\n      \"data_type\": \"number\",\n      \"unit\": \"seconds\",\n      \"aggregation\": \"weighted_average_requires_successful_fill_count\",\n      \"definition\": \"从发起请求到广告返回成功的平均耗时。\",\n      \"documentation_status\": \"documented\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\"]\n    },\n    \"click_share\": {\n      \"source_columns\": [\"点击占比\"],\n      \"display_name\": \"点击占比\",\n      \"semantic_name_en\": \"topon_click_share\",\n      \"kind\": \"metric\",\n      \"data_type\": \"rate\",\n      \"unit\": \"fraction\",\n      \"aggregation\": \"recompute_from_report_total_clicks\",\n      \"formula\": \"clicks / report_total_clicks\",\n      \"definition\": \"当前广告源 TopOn 点击数占本次聚合管理报表汇总点击数的比例。\",\n      \"documentation_status\": \"export_formula_inferred_and_recomputable\",\n      \"validation_status\": \"recomputable_from_export_summary\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\"]\n    },\n    \"revenue_api_share\": {\n      \"source_columns\": [\"收益占比\"],\n      \"display_name\": \"收益 API 占比\",\n      \"semantic_name_en\": \"third_party_revenue_share\",\n      \"kind\": \"metric\",\n      \"data_type\": \"rate\",\n      \"unit\": \"fraction\",\n      \"aggregation\": \"recompute_from_report_total_revenue_api\",\n      \"formula\": \"revenue_api / report_total_revenue_api\",\n      \"definition\": \"当前广告源第三方平台 API 收益占报表汇总 API 收益的比例。\",\n      \"documentation_status\": \"export_formula_inferred_and_recomputable\",\n      \"validation_status\": \"recomputable_from_export_summary\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\"]\n    },\n    \"impressions_api_share\": {\n      \"source_columns\": [\"展示API占比\"],\n      \"display_name\": \"展示 API 占比\",\n      \"semantic_name_en\": \"third_party_impression_share\",\n      \"kind\": \"metric\",\n      \"data_type\": \"rate\",\n      \"unit\": \"fraction\",\n      \"aggregation\": \"recompute_from_report_total_impressions_api\",\n      \"formula\": \"impressions_api / report_total_impressions_api\",\n      \"definition\": \"当前广告源第三方平台展示 API 占报表汇总展示 API 的比例。\",\n      \"documentation_status\": \"export_formula_inferred_and_recomputable\",\n      \"validation_status\": \"recomputable_from_export_summary\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\"]\n    },\n    \"clicks_api_share\": {\n      \"source_columns\": [\"点击API占比\"],\n      \"display_name\": \"点击 API 占比\",\n      \"semantic_name_en\": \"third_party_click_share\",\n      \"kind\": \"metric\",\n      \"data_type\": \"rate\",\n      \"unit\": \"fraction\",\n      \"aggregation\": \"none_without_clicks_api_count\",\n      \"definition\": \"当前广告源第三方平台 API 点击数占报表汇总 API 点击数的比例；当前导出未包含点击 API 原始计数。\",\n      \"documentation_status\": \"documented_metric_missing_export_numerator\",\n      \"validation_status\": \"definition_known_export_inputs_missing\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/bUh0Id\"]\n    }\n  }\n}\n"},{"id":"user-acquisition-and-payback","path":"references/user-acquisition-and-payback.md","title":"买量回收与商业化协同","group":"增长支持","tag":"Growth","description":"CAC、LTV、ROAS、事件回传、归因和放量门禁","kind":"support","lines":86,"headings":["买量回收与商业化协同","目录","回收判据和漏斗","成本、质量和事件","归因与隐私","素材、首体验和 ROAS","运营与放量"],"content":"# 买量回收与商业化协同\n\n\u003e 来源：Google App campaigns、Meta App promotion、TikTok App Promotion 和 Apple Ads 的平台角色参考 **[UA-GOOGLE-01-关于应用广告系列]** **[UA-GOOGLE-02-设置应用广告系列]** **[UA-META-01-Meta 应用推广目标]** **[UA-META-02-Meta 应用广告]** **[UA-TIKTOK-01-TikTok 移动应用广告指南]** **[UA-TIKTOK-02-TikTok 应用推广目标]** **[UA-APPLEADS-01-App Store 广告]** **[UA-APPLEADS-02-Apple Ads 创建广告系列]**；LTV、CAC、ROAS 和队列分析属于 GEN 结构性方法。\n\n## 目录\n\n- 回收判据和漏斗\n- 成本、质量和事件\n- 归因与隐私\n- 素材、首体验和 ROAS\n- 运营与放量\n\n## 回收判据和漏斗\n\n净 LTV = IAA LTV + IAP LTV - 退款、税费和其他损耗\n\nCAC = 投放花费 / 有效新增用户\n\nROAS = 已回收收入 / 投放花费\n\n结论必须注明观察周期。短期 ROAS 不能替代完整 LTV，也不能忽略现金流、退款和留存。\n\n买量漏斗：\n\n预算 → 展示 → 点击 → 商店页访问 → 安装 → 首次打开 → 核心任务 → 广告或付费触点 → IAA/IAP 收入 → 留存与回收\n\n沿漏斗定位，不把单个阶段的高转化当作最终成功。\n\n## 成本、质量和事件\n\n低 CPI 只说明安装便宜，不能说明用户能够回收。判断顺序是 CPI、激活成本、广告和付费收入、留存、净 LTV、ROAS。\n\n安装增加但收入不涨时，检查地区与渠道结构、素材承诺、版本、核心任务、广告事件和付费事件，不要只调整出价。\n\n事件按深度分层：\n\n| 层级 | 示例 | 用途 |\n|:---:|:---|:---|\n| 浅层 | 安装、首次打开、新手完成 | 提供数量足够的激活信号 |\n| 中层 | 核心任务完成、广告场景、付费墙展示 | 表示进入价值和变现路径 |\n| 深层 | 广告收入、试用、购买、续订、退款 | 校准真实商业价值 |\n\n浅层事件量大但离收入远，深层事件价值高但量少。Google、Meta 和 TikTok 的公开资料都把安装、应用内事件或价值优化区分为不同目标，分别参照 **[UA-GOOGLE-01-关于应用广告系列]** **[UA-META-01-Meta 应用推广目标]** **[UA-TIKTOK-02-TikTok 应用推广目标]**。用量足够的代理事件优化，同时用收入事件校准。\n\n## 归因与隐私\n\n归因至少保留媒体、活动、广告组、素材、地区、平台和优化事件。命名稳定、可解析，变更时保留历史映射。\n\n归因系统服务于优化，不等于财务结算。投放、归因、商业化和财务数据不一致时，核对窗口、时区、币种、去重和收入确认。\n\niOS 隐私归因通常具有聚合和延迟特征：不做分钟级调整，不假设能恢复单用户完整路径；选择早期产生且与长期价值相关的信号。\n\n## 素材、首体验和 ROAS\n\n素材吸引目标用户，商店页承接承诺，首体验完成价值验证。\n\n| 现象 | 优先检查 |\n|:---:|:---|\n| 点击高、安装低 | 素材与商店页是否一致 |\n| 安装高、激活低 | 承诺是否匹配产品，新手流程是否阻塞 |\n| 激活高、收入低 | 广告场景、付费墙和事件是否到达 |\n| 收入高、留存低 | 是否过度变现、误导或牺牲核心任务 |\n\n评价素材看用户 LTV，不只看点击率。\n\nROAS 下降拆成两侧：\n\n- 成本上升：展示或点击价格、竞争、流量结构、出价策略。\n- LTV 下降：激活、广告展示或 eCPM、付费转化或续订、留存。\n\n短期高 ROAS 要先排除归因窗口、收入确认、小样本、自然量和留存影响，再决定放量。\n\n## 运营与放量\n\n每日检查花费、安装、激活成本、早期广告和付费收入、核心任务和事件异常；按地区、平台、活动和素材拆分。\n\n每周检查队列 LTV、回收周期、素材疲劳、渠道结构、商店页转化，以及投放、归因、商业化和结算口径差异。\n\n放量前确认：\n\n1. 归因命名统一，关键维度完整。\n2. 核心任务、商业化触点和收入事件正常回传。\n3. ROI 按用户队列计算，不与自然日收入混算。\n4. 已定义预算停止条件和异常回退方式。\n5. 留存、退款和核心任务完成率作为护栏。\n"},{"id":"product-research-and-cases","path":"references/product-research-and-cases.md","title":"产品研究与匿名案例","group":"增长支持","tag":"Research","description":"AppMagic 筛选、产品拆解、场景审查和案例迁移","kind":"support","lines":109,"headings":["产品研究与匿名案例","目录","研究边界","市场筛选","定义问题","采集字段","筛选与复核","产品拆解","广告场景审查","匿名模式","从案例形成建议","交付模板"],"content":"# 产品研究与匿名案例\n\n\u003e 来源：AppMagic 的市场情报、应用比较和趋势研究能力参考 **[RESEARCH-APPMAGIC-01-AppMagic 移动应用市场情报]** **[RESEARCH-APPMAGIC-02-AppMagic 研究]**；匿名化、案例迁移和广告场景审查属于 GEN 研究方法。\n\n## 目录\n\n- 研究边界\n- 市场筛选\n- 产品拆解\n- 广告场景审查\n- 匿名模式\n- 建议和交付\n\n## 研究边界\n\n市场数据和竞品案例用于形成假设，不证明目标产品应采用相同策略。只保留方法、结构和可验证模式，不保留具体应用、开发者、商店链接、排名、市场份额、设备、内部阈值或原始业务数值。\n\n只有不可读取内容或空模板而没有可读取正文时，不从中提取事实。无法从文本确认的广告触发、价格和用户流程标记为待验证。\n\n## 市场筛选\n\n### 定义问题\n\n先确定品类、平台、地区、时间范围和目标，例如增长品类、主要市场、产品结构参考或商业化案例池。\n\n### 采集字段\n\n使用 AppMagic 或同类工具时统一采集：\n\n- 品类、核心功能、发布和更新时间。\n- 下载、收入和排名的时间趋势。\n- 主要地区及其变化。\n- IAA、IAP 或混合变现信号。\n- 数据覆盖、缺失和估算边界。\n\n固定时间边界和去重规则，按周期追加历史快照，不覆盖旧数据。\n\n### 筛选与复核\n\n1. 用趋势而不是单日排名筛选。\n2. 将下载增长和收入增长分开观察。\n3. 检查增长是否集中在单一地区或短时活动。\n4. 标记新应用、小样本和数据缺失。\n5. 将市场信号与产品功能和变现路径结合复核。\n\n市场工具提供方向，不提供目标产品的真实线上流量；线上分组必须用自有数据校正。\n\n## 产品拆解\n\n按以下顺序记录：\n\n1. 定位：品类、核心用户、核心任务和使用频率。\n2. 功能：主页、核心功能、次要功能、内容区、设置和付费入口。\n3. 用户流程：首次启动、核心任务、结果页、返回、再次启动和异常分支。\n4. 广告链路：形式、位置、触发、频率、冷却、关闭去向和失败表现。\n5. 付费链路：入口、权益、套餐、购买触发和去广告关系。\n6. 优点与问题：分别说明产品价值、变现覆盖和体验风险。\n7. 假设与验证：只提出目标产品可验证的最小改动。\n\n产品事件与广告事件放在同一时间线，但使用不同字段，以判断广告发生在任务开始前、执行中还是完成后。\n\n## 广告场景审查\n\n每个场景都回答：\n\n- 用户此时要完成什么任务。\n- 广告是否位于自然断点。\n- 是否由用户主动选择，权益是否可理解和兑现。\n- 是否可能遮挡、误触或重复触发。\n- 首次使用和返回用户是否需要不同策略。\n- 关闭后回到哪里，需要哪些事件验证触发、展示和任务结果。\n\n## 匿名模式\n\n| 产品模式 | 可验证的广告思路 | 主要护栏 |\n|:---:|:---|:---|\n| 高频入口或桌面 | 内容流用原生，稳定工具页评估横幅，完成或返回节点测试插屏 | 首次设置和默认入口避免过早强制广告 |\n| 文件处理或效率工具 | 结果页承接原生/横幅，完成后测试插屏，额外次数用激励 | 连续处理需频率和冷却，权益必须真实 |\n| 休闲游戏 | 教程后在关卡边界使用插屏，道具和额外机会使用激励 | 教程优先理解玩法，避免广告遮挡操作 |\n| 内容或个性化产品 | 列表用原生/信息流，主题和高级内容用激励或付费解锁 | 语言、权限、关闭和预览控件保持可见 |\n| 前后台恢复 | 区分冷启动、热启动、短切换和长时返回 | 冷却，避免覆盖未保存输入或结果 |\n\n激励广告提供即时或短期权益，去广告 IAP 提供持续权益；拒绝激励广告后仍应能回到正常任务。\n\n## 从案例形成建议\n\n1. 提取任务阶段、广告形式和触发逻辑。\n2. 判断目标产品是否存在同类任务和自然断点。\n3. 列出适用与不适用条件。\n4. 设计一个主要变量的测试版本。\n5. 补齐场景到达、广告漏斗和任务完成事件。\n6. 定义收益指标、体验护栏和回退条件。\n\n案例中的广告数量、频率、价格、地区和收入表现不是默认参数，目标产品数据未验证前只能作为假设。\n\n## 交付模板\n\n| 模块 | 内容 |\n|:---:|:---|\n| 研究问题 | 品类、市场、产品结构或变现机会 |\n| 证据范围 | 工具、时间、地区、文本拆解和缺失项 |\n| 产品模式 | 核心任务、使用频率和功能结构 |\n| 商业化模式 | 广告形式、场景、付费入口和相互关系 |\n| 体验风险 | 首次任务、连续操作、遮挡、误触和重复触发 |\n| 可迁移假设 | 适用条件明确的设计或配置思路 |\n| 验证方案 | 单一变量、事件、指标、护栏和回退 |\n\n输出使用品类和场景描述，不引用具体产品名称或原始市场数值。\n"},{"id":"iap-metrics-funnel-diagnostics","path":"references/iap-metrics-funnel-diagnostics.md","title":"IAP 指标、漏斗与诊断","group":"IAP 按需","tag":"IAP","description":"订阅指标、LTV、付费漏斗、续订、流失和退款","kind":"iap","lines":91,"headings":["IAP 指标、漏斗与诊断","目录","核心指标","结算与估算口径","LTV 树和转化漏斗","留存、流失与挽回","常见问题"],"content":"# IAP 指标、漏斗与诊断\n\n\u003e 来源：商店订阅、状态通知和生命周期参考 **[IAP-APPLE-01-App Store 订阅]** **[IAP-APPLE-02-启用 App Store 服务端通知]** **[IAP-GPLAY-01-关于订阅]** **[IAP-GPLAY-02-购买生命周期]** **[IAP-GPLAY-03-订阅生命周期]**；订阅分析和队列方法参考 **[IAP-REVCAT-02-订阅应用状态报告]** **[IAP-ADAPTY-01-Adapty 付费墙 A/B 测试]**；指标公式、漏斗和诊断顺序属于 GEN 结构性方法。\n\n## 目录\n\n- 核心指标\n- 结算与估算口径\n- LTV 树和转化漏斗\n- 留存、流失与挽回\n- 常见问题\n\n本文只在用户明确询问 IAP 或混合变现时按需读取。IAP 的作用是补充付费价值、续订和退款判断，不替代 IAA 主线。\n\n## 核心指标\n\n| 指标 | 定义或公式 | 用途 |\n|:---:|:---|:---|\n| 付费转化率 | 付费用户 / 新增用户，或 install 到 paid | 判断整体变现效率 |\n| 试用启动率 | 启动试用 / 付费墙曝光 | 判断付费墙吸引力 |\n| 试用转化率 | 转为付费 / 启动试用 | 判断试用期价值和到期承接 |\n| ARPU | 总收入 / 全部用户 | 观察全体用户价值 |\n| ARPPU | 总收入 / 付费用户 | 观察付费用户价值 |\n| LTV / install | 用户净终身价值 / 新增用户 | 作为长期取舍依据 |\n| MRR / ARR | 月度或年度经常性收入 | 观察订阅存量 |\n| 净收入 | 收入减商店费用、退款、税费等 | 用于对账和净 LTV |\n\n| 指标 | 定义或用途 |\n|:---:|:---|\n| 续订留存 | 第 N 期仍订阅 / 首期付费，按队列观察 |\n| 流失率 | 1 - 对应周期续订留存 |\n| 主动流失 | 用户主动取消或不再续订 |\n| 被动流失 | 扣款失败导致的流失 |\n| 挽回率 | 重试或宽限期内恢复扣款 / 进入挽回流程的订阅 |\n| 退款率 | 退款金额或单数 / 对应收入或订单 |\n\n## 结算与估算口径\n\n商店结算数据用于确认最终净收入；订阅平台或 SDK 的实时数据用于漏斗、队列和趋势诊断。Apple、Google 的订阅后台和服务端状态机制分别参照 **[IAP-APPLE-01-App Store 订阅]** **[IAP-APPLE-02-启用 App Store 服务端通知]** **[IAP-GPLAY-01-关于订阅]** **[IAP-GPLAY-02-购买生命周期]**。两者会因退款、税费、汇率、延迟和口径不同产生差异。\n\nLTV 使用净结算口径；实时估算只用于及时定位问题。对账时不要用实时估算替代结算数据。\n\n## LTV 树和转化漏斗\n\n订阅 LTV 可拆为：\n\nLTV / install = 付费墙触达率 × 试用启动率 × 试用转化率 × Σ（各期续订留存 × 净单价）\n\n| 叶子 | 主要杠杆 |\n|:---:|:---|\n| 付费墙触达率 | 位置、时机、功能墙和 onboarding 路径 |\n| 试用启动率 | 价值呈现、试用门槛、是否需要支付方式 |\n| 试用转化率 | 试用时长、价值送达、到期提醒和信任 |\n| 续订留存 | 持续价值、再触达和被动流失挽回 |\n| 净单价 | 价格、周期、地区、商店费用、退款和税费 |\n\n转化漏斗：\n\n安装 → 引导完成 → 付费墙曝光 → 套餐或 CTA → 发起购买 → 试用或直接购买 → 激活权益 → 首期付费 → 续订或流失\n\n| 掉点 | 优先检查 |\n|:---:|:---|\n| 引导完成率低 | 引导长度、价值表达和首个任务 |\n| 付费墙曝光率低 | 是否埋得太深、是否错过价值时刻 |\n| CTA 点击低 | 收益表达、价格、套餐数量和信任 |\n| 购买完成低 | 商品加载、支付流程和用户犹豫 |\n| 试用转化低 | 价值是否送达、提醒、试用长度和价格 |\n| 续订低 | 持续价值、队列构成和被动流失 |\n\n按渠道、地区、价格、版本和付费墙版本拆队列，不能只看混合均值。\n\n## 留存、流失与挽回\n\n首次续订通常是重要观察节点，但具体留存基准取决于品类、周期、地区和用户质量，不能套用固定数字。\n\n主动流失主要回到价值、价格、周期和取消挽留；被动流失主要检查支付失败、重试、宽限期、账户保留、服务端状态通知和支付方式提醒。\n\n平台提供的宽限和重试机制应与应用内权益状态一致；Google 的生命周期状态参照 **[IAP-GPLAY-03-订阅生命周期]**，Apple 的服务端通知参照 **[IAP-APPLE-02-启用 App Store 服务端通知]**。恢复、暂停、失败、退款等状态必须进入服务端和数据漏斗，避免把被动流失误判为产品价值问题。\n\n## 常见问题\n\n| 现象 | 诊断路径 |\n|:---:|:---|\n| 付费转化下降 | 按队列检查渠道/地区、付费墙改动、漏斗掉点和商品加载 |\n| 试用启动高但转化低 | 检查试用期价值、提醒、时长、价格和用户质量 |\n| 续订下降 | 先区分主动与被动，再看持续价值、首期续订和周期 |\n| 退款上升 | 检查误导或误触、价值不符、地区和支付方式 |\n| 收入变化 | 沿新增、付费墙触达、试用、续订、净单价逐叶排查 |\n\n前端问题优先看获量和用户质量，后端问题优先看产品、付费墙、定价、留存和平台状态；始终按版本和队列拆分。\n"},{"id":"iap-paywall-pricing-ops","path":"references/iap-paywall-pricing-ops.md","title":"IAP 付费墙、定价与运营","group":"IAP 按需","tag":"IAP","description":"付费墙、定价、试用、商店机制、实验和合规","kind":"iap","lines":79,"headings":["IAP 付费墙、定价与运营","目录","付费墙","定价和试用","商店与订阅基础设施","产品打包","实验、合规和运营"],"content":"# IAP 付费墙、定价与运营\n\n\u003e 来源：Apple 和 Google 的商店机制、订阅、恢复购买和政策参考 **[IAP-APPLE-01-App Store 订阅]** **[IAP-APPLE-02-启用 App Store 服务端通知]** **[IAP-APPLE-03-App Store 审核指南]** **[IAP-GPLAY-01-关于订阅]** **[IAP-GPLAY-02-购买生命周期]** **[IAP-GPLAY-04-了解订阅]**；订阅后端和付费墙实验参考 **[IAP-REVCAT-01-RevenueCat 订阅商业化平台]** **[IAP-REVCAT-02-订阅应用状态报告]** **[IAP-ADAPTY-01-Adapty 付费墙 A/B 测试]** **[IAP-ADAPTY-02-Adapty 创建、运行和停止 A/B 测试]**。\n\n## 目录\n\n- 付费墙\n- 定价和试用\n- 商店与订阅基础设施\n- 产品打包\n- 实验、合规和运营\n\n本文只保留跨平台相对稳定的 IAP 常识。商店费用、政策、接口和审核要求会变化，执行时以当前受控配置和已确认规则为准，不在运行时访问外部资料。\n\n## 付费墙\n\n| 类型 | 适用时机 | 主要风险 |\n|:---:|:---|:---|\n| Onboarding 付费墙 | 引导末尾或首次价值前 | hard 转化可能更高，但留存和退款风险也更高 |\n| 情境付费墙 | 触达功能墙、使用上限或高级功能 | 价值明确，但触发条件要稳定 |\n| 常驻入口 | 设置页或稳定页面 | 提供持续入口，避免干扰核心任务 |\n| 取消挽留页 | 用户取消时 | 可提供降档或挽留，但不能阻碍取消 |\n\n设计原则：\n\n1. 在用户理解价值或触达限制时展示。\n2. 用结果表达权益，明确价格、周期、试用转付费和取消方式。\n3. 套餐不要过多，推荐项和年订价值要可理解。\n4. 提供恢复购买，购买后立即引导用户使用权益。\n5. 不用误导文案、隐藏条件或难以关闭的流程换取转化。\n\n## 定价和试用\n\n定价可调整价格点、周期、地区本地化、套餐组合、锚定和引导优惠；商店商品、周期和 offers 的对象关系参照 **[IAP-GPLAY-01-关于订阅]** **[IAP-GPLAY-04-了解订阅]**。提价可能提高单价但降低转化，降价可能相反；以净 LTV 或每安装净收入判断，不只看 CVR。\n\n试用策略需要同时考虑时长、是否需要支付方式、价值送达、到期提醒和取消体验。Apple 和 Google 的试用及优惠资格以商店配置为准，分别参照 **[IAP-APPLE-01-App Store 订阅]** **[IAP-GPLAY-01-关于订阅]**；试用长度与支付方式都应通过队列实验验证。\n\n引导优惠要明确资格、周期、转正价格和权益范围。老用户、流失用户和新用户的优惠不要混在同一口径。\n\n## 商店与订阅基础设施\n\n数字功能和内容通常通过平台内购完成。Apple 和 Google 都提供订阅周期、试用或优惠、恢复购买、退款和服务端状态通知等机制，但对象名称、资格规则和接口细节不同，具体以 **[IAP-APPLE-01-App Store 订阅]** **[IAP-APPLE-02-启用 App Store 服务端通知]** **[IAP-APPLE-03-App Store 审核指南]** **[IAP-GPLAY-01-关于订阅]** **[IAP-GPLAY-02-购买生命周期]** 为准。\n\n订阅基础设施可统一处理收据或交易校验、跨平台权益、续订状态、退款同步、漏斗分析和付费墙实验；平台能力可参照 **[IAP-REVCAT-01-RevenueCat 订阅商业化平台]** **[IAP-REVCAT-03-RevenueCat 文档]** **[IAP-ADAPTY-03-Adapty 启用购买]**。是否使用托管平台，取决于产品规模、跨平台需求和服务端能力。\n\n国内 Android 通常是多渠道并行，支付 SDK、分成、商品配置和权益发放需要逐渠道核对；权益系统应能按渠道统一校验。\n\n## 产品打包\n\n| 产品类型 | 可放入付费权益的价值 | 触发时机 |\n|:---:|:---|:---|\n| 清理或优化 | 深度能力、自动化、去广告 | 扫描出结果或执行高级操作 |\n| 扫描或 OCR | 批量处理、导出格式、同步 | 导出或保存时 |\n| PDF 或转换 | 批量、更多格式、次数上限 | 触达免费额度时 |\n| 文件管理 | 云备份、加密空间、去广告 | 备份或加密入口 |\n| 照片或视频 | 高级效果、无水印、批量、高清导出 | 导出或应用高级效果 |\n| 习惯或效率 | 无限项目、统计、跨设备同步 | 触达免费上限或查看高级统计 |\n\n免费层要让用户体验核心价值，同时保留明确且真实的付费动机。不要只写权益而不提供对应功能。\n\n## 实验、合规和运营\n\n可测试变量包括付费墙布局、文案、价格、套餐、默认项、试用时长、支付方式、引导付费墙和取消挽留 offer；实验创建、运行和停止可参照 **[IAP-ADAPTY-01-Adapty 付费墙 A/B 测试]** **[IAP-ADAPTY-02-Adapty 创建、运行和停止 A/B 测试]**。\n\n主指标使用净 LTV 或每安装净收入；次级指标观察试用转化、首期续订、退款、留存和卸载。订阅存在长尾，不能只看当天转化。\n\n上线流程：\n\n1. 确认模型、商品、周期、价格和权益。\n2. 配置商店商品、订阅周期、优惠和资格。\n3. 接入权益校验、服务端状态通知和退款处理。\n4. 埋点付费墙、CTA、购买、试用、续订、取消和退款。\n5. 用测试环境覆盖购买、恢复、续订失败、宽限、恢复和退款。\n6. 上线后按队列、渠道、地区和付费墙版本监控。\n\n合规至少检查价格、周期、续订、取消、试用转付费、恢复购买、数字内容支付方式、隐私同意和退款路径；Apple 审核和恢复购买要求参照 **[IAP-APPLE-03-App Store 审核指南]**。不要用付费墙阻塞取消或隐藏关键条件。\n\n常见误区：只看转化率、不看净 LTV；用实时估算对账；忽略被动流失；混合队列；试用期没有价值送达；全球统一价格；付费墙埋得太深；没有恢复购买；只看 D0；把高退款当作单纯营销问题。\n"},{"id":"public-sources","path":"references/public-sources.md","title":"公开来源与引用注册表","group":"来源","tag":"Sources","description":"公开 URL、来源层级、引用编号和原始页面","kind":"source","lines":119,"headings":["公开来源与引用注册表","使用规则","IAA 公开来源","穿山甲 / CSJ / Pangle","AppLovin / MAX","TopOn","IAP 公开来源","Apple","Google Play","订阅基础设施和付费墙实验","买量和产品研究来源","引用说明"],"content":"# 公开来源与引用注册表\n\n## 使用规则\n\n本文件只登记公开网页，不登记内部页面、文档、账户、项目或业务数据。构建完成后可以联网访问下列公开来源核对页面和时效性，但不得再访问受限构建来源。\n\n引用格式为加粗的“编号-中文标题”，例如 **[IAA-TOPON-01-聚合平台概况]**。引用应紧跟被支持的事实；同一段包含多个事实时分别标注，不用一个链接覆盖整段无关内容。\n\n来源层级：\n\n- 官方平台文档：用于产品机制、接口、政策、商店流程和平台对象。\n- 平台帮助中心：用于聚合配置、报表字段、竞价、Waterfall、分组和实验方法。\n- 厂商报告或公开研究：用于方向性趋势和相对比较，不当作目标产品的绝对基准。\n- 通用方法：公式、漏斗和实验纪律属于结构性方法，标注 GEN，不伪装成某一家平台的结论。\n\n页面核验日期：2026-08-04。页面内容、政策、费用和接口可能变化；引用时以页面当前版本和用户自己的后台数据为准。\n\n## IAA 公开来源\n\n### 穿山甲 / CSJ / Pangle\n\n| 编号 | 支持范围 | 原始页面 |\n|:---:|:---|:---|\n| IAA-CSJ-01 | 收益拆解、展示率、点击率和转化率方法 | [成长中心：收益方法论](https://www.csjplatform.com/growthcenter/6101274400195d0046c2731d) |\n| IAA-CSJ-02 | 开屏、横幅、插屏、激励和原生广告形式 | [成长中心：广告样式](https://www.csjplatform.com/growthcenter/61010a9cefaa39004d1c0e16) |\n| IAA-CSJ-03 | GroMore 聚合和休闲游戏发行策略 | [成长中心：GroMore 发行指南](https://www.csjplatform.com/growthcenter/6126410ed00c3f00549ff71b) |\n| IAA-CSJ-04 | 工具行业解决方案和产品入口 | [穿山甲官网](https://www.csjplatform.com/) |\n| IAA-CSJ-05 | GroMore、变现自动化和成长中心索引 | [穿山甲成长中心](https://www.csjplatform.com/growthcenter) |\n\n### AppLovin / MAX\n\n| 编号 | 支持范围 | 原始页面 |\n|:---:|:---|:---|\n| IAA-MAX-01 | MAX 开发者文档、SDK、聚合和买量能力 | [AppLovin 开发者文档](https://developers.applovin.com/zh/) |\n| IAA-MAX-02 | Mediation Debugger、适配器和 Waterfall 排查 | [MAX 中介调试器](https://developers.applovin.com/zh/max/android/testing-networks/mediation-debugger/) |\n| IAA-MAX-03 | 传统聚合网络接入和隐私配置 | [MAX 传统聚合网络指南](https://developers.applovin.com/zh/max/mediated-network-guides/traditionally-mediated-network-guides/) |\n| IAA-MAX-04 | 公司和平台公开介绍 | [AppLovin 中文官网](https://www.applovin.com/zh/) |\n| IAA-MAX-SECONDARY | AppLovin 的公开行业背景，仅作二级资料 | [36氪：一页纸讲透 AppLovin](https://www.36kr.com/p/3480808267798659) |\n\n### TopOn\n\n| 编号 | 支持范围 | 原始页面 |\n|:---:|:---|:---|\n| IAA-TOPON-01 | 聚合概况、广告平台、Bidding 对接和报表时区 | [聚合平台概况](https://help.toponad.net/cn/docs/2KR6QU) |\n| IAA-TOPON-02 | 排序价格、底价、自动价格和兜底 | [价格和底价](https://help.toponad.net/cn/docs/cXus5n) |\n| IAA-TOPON-03 | 流量分组、广告源和自动配置 | [分组与广告源](https://help.toponad.net/cn/docs/KjVUSq) |\n| IAA-TOPON-04 | 头部竞价、竞价平台和竞价底价 | [头部竞价](https://help.toponad.net/cn/docs/dfnwQG) |\n| IAA-TOPON-05 | Waterfall 分层和并行请求 | [Waterfall 结构](https://help.toponad.net/cn/docs/bUh0Id) |\n| IAA-TOPON-06 | Waterfall 层级和填充率调整 | [Waterfall 优化](https://help.toponad.net/cn/docs/QXxkrR) |\n| IAA-TOPON-07 | 展示频次和并行请求等配置 | [加载与频次](https://help.toponad.net/cn/docs/eUCSzO) |\n| IAA-TOPON-08 | 应用启动到展示、点击的漏斗 | [漏斗分析](https://help.toponad.net/cn/docs/qlHqYM) |\n| IAA-TOPON-09 | 三方 API、统计数据和展示差异 | [数据来源](https://help.toponad.net/cn/docs/Z4zsF6) |\n| IAA-TOPON-10 | 有效展示和展示 Gap 排查 | [有效展示](https://help.toponad.net/cn/docs/5e6DnV) |\n| IAA-TOPON-11 | DAU、请求、填充、展示和 eCPM 的收益拆解 | [收益变动分解](https://help.toponad.net/cn/docs/cdsQvH) |\n| IAA-TOPON-12 | 收益波动和分层排查 | [收益分析](https://help.toponad.net/cn/docs/SxzgbM) |\n| IAA-TOPON-13 | A/B 预估口径、AABB、辛普森悖论和分配 | [A/B 测试](https://help.toponad.net/cn/docs/PqmmHP) |\n| IAA-TOPON-14 | 交叉推广和直投广告 | [交叉推广](https://help.toponad.net/cn/docs/Popzgt) |\n| IAA-TOPON-15 | 数据预警 | [数据预警](https://help.toponad.net/cn/docs/LQgwMA) |\n| IAA-TOPON-16 | 留存价值、用户行为和分小时报表 | [用户价值与报表](https://help.toponad.net/cn/docs/p8JTEN) |\n| IAA-TOPON-17 | 广告分层入门和优化技巧 | [广告分层入门和优化技巧](https://help.toponad.net/cn/docs/eUCSzO) |\n| IAA-TOPON-18 | 头部竞价 | [头部竞价](https://help.toponad.net/cn/docs/dfnwQG) |\n| IAA-TOPON-19 | 聚合管理（Waterfall）报表数据说明 | [聚合管理（Waterfall）报表数据说明](https://help.toponad.net/cn/docs/bUh0Id) |\n| IAA-TOPON-20 | 综合报表指标、字段和报表时区 | [综合报表](https://help.toponad.net/cn/docs/DVM3Tf) |\n| IAA-TOPON-21 | Open API 综合报表字段和口径 | [Open API 综合报表](https://help.toponad.net/cn/docs/dukFyc) |\n\n旧版 cn/docs 页面保留用于来源追溯；如果页面跳转到新地址，以同一主题的当前官方页面为准。\n\n## IAP 公开来源\n\n### Apple\n\n| 编号 | 支持范围 | 原始页面 |\n|:---:|:---|:---|\n| IAP-APPLE-01 | App Store 订阅和内购总览 | [App Store 订阅](https://developer.apple.com/cn/app-store/subscriptions/) |\n| IAP-APPLE-02 | StoreKit、服务端通知和订阅状态事件 | [启用 App Store 服务端通知](https://developer.apple.com/documentation/storekit/enabling-app-st             }).join("") + "</tr></thead><tbody>";
            rows.forEach(function (row) {
              html += "<tr>" + headers.map(function (_, index) {
                return "<td>" + inlineMarkdown(row[index] || "") + "</td>";
              }).join("") + "</tr>";
            });
            html += "</tbody></table>";
            continue;
          }

          var unordered = line.match(/^\s*-\s+(.+)$/);
          var ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            var nextType = unordered ? "ul" : "ol";
            if (listType && listType !== nextType) { flushList(); }
            listType = nextType;
            listItems.push((unordered || ordered)[1]);
            continue;
          }
          flushList();
          html += "<p>" + inlineMarkdown(line) + "</p>";
        }

        if (code) { flushCode(); }
        flushList();
        return html;
      }

      function citationIds(content) {
        var matches = [];
        var pattern = new RegExp("\\[(" + sourceIdPattern + ")(?:-[^\\]]+)?\\]", "g");
        var match;
        while ((match = pattern.exec(String(content || ""))) !== null) {
          if (matches.indexOf(match[1]) === -1) { matches.push(match[1]); }
        }
        return matches;
      }

      function tagClass(tag) {
        if (tag === "IAP") { return "pill violet"; }
        if (tag === "Sources") { return "pill orange"; }
        if (tag === "Growth" || tag === "Research") { return "pill blue"; }
        return "pill";
      }

      function docById(id) {
        return docs.filter(function (doc) { return doc.id === id; })[0];
      }

      function renderNav() {
        nav.innerHTML = GROUP_ORDER.map(function (group) {
          var groupDocs = docs.filter(function (doc) { return doc.group === group; });
          if (!groupDocs.length) { return ""; }
          return '<div class="nav-group"><div class="nav-group-title">' + escapeHtml(group) + '</div>' +
            groupDocs.map(function (doc, index) {
              var active = state.view === doc.id && !state.query ? " active" : "";
              return '<button class="nav-item' + active + '" type="button" data-view="' + doc.id + '">' +
                '<span class="nav-index">' + String(index + 1).padStart(2, "0") + '</span>' +
                '<span class="nav-copy"><span class="nav-title">' + escapeHtml(doc.title) + '</span>' +
                '<span class="nav-meta">' + doc.lines + ' 行 · ' + escapeHtml(doc.tag) + '</span></span></button>';
            }).join("") + "</div>";
        }).join("");
      }

      function renderOverview() {
        var meta = DATA.meta || {};
        var cards = docs.filter(function (doc) { return doc.kind !== "entry" && doc.kind !== "source"; });
        main.innerHTML =
          '<div class="content-width">' +
            '<section class="hero">' +
              '<div class="eyebrow"><span class="eyebrow-line"></span>IAA 主线 / 本地预览</div>' +
              '<h1 class="hero-title">一张图浏览整个商业化 Skill</h1>' +
              '<p class="hero-lede">以 IAA 为主线，从广告设计、平台配置、上线验收、数据诊断到买量回收；IAP 作为按需加载的订阅常识补充，公开来源和引用关系集中在来源库。</p>' +
              '<div class="hero-note"><span class="pill">只读快照</span><span class="pill orange">公开来源可跳转</span><span class="pill blue">Reference 全文已嵌入</span></div>' +
            '</section>' +
            '<section class="metrics">' +
              '<div class="metric"><span class="metric-value">' + meta.fileCount + '</span><span class="metric-label">已嵌入文件</span></div>' +
              '<div class="metric"><span class="metric-value">' + meta.lineCount + '</span><span class="metric-label">Markdown 行数</span></div>' +
              '<div class="metric"><span class="metric-value">' + meta.iaaCount + '</span><span class="metric-label">IAA 核心模块</span></div>' +
              '<div class="metric"><span class="metric-value">' + meta.sourceCount + '</span><span class="metric-label">来源编号</span></div>' +
            '</section>' +
            '<div class="section-heading"><h2>运行路径</h2><p>从触发到验证的工作关系</p></div>' +
            '<section class="architecture">' +
              '<div class="architecture-step"><span class="architecture-kicker">01 / 入口</span><h3 class="architecture-title">识别任务</h3><p class="architecture-copy">分类、固定边界，决定需要加载哪些参考文件。</p></div>' +
              '<div class="architecture-step"><span class="architecture-kicker">02 / IAA</span><h3 class="architecture-title">还原广告链路</h3><p class="architecture-copy">从场景到请求、填充、可展示和实际展示。</p></div>' +
              '<div class="architecture-step"><span class="architecture-kicker">03 / 判断</span><h3 class="architecture-title">定位异常节点</h3><p class="architecture-copy">用收益树、数据口径和来源编号解释变化。</p></div>' +
              '<div class="architecture-step"><span class="architecture-kicker">04 / 迭代</span><h3 class="architecture-title">动作与回退</h3><p class="architecture-copy">单变量改动，设护栏、观察窗口和回退条件。</p></div>' +
            '</section>' +
            '<div class="section-heading"><h2>模块与 Reference 内容</h2><p>点击任意模块查看对应 reference 全文</p></div>' +
            '<section class="module-grid">' +
              cards.map(function (doc) {
                return '<a class="module-card" href="#module/' + doc.id + '" data-view="' + doc.id + '">' +
                  '<div class="module-card-top"><span class="' + tagClass(doc.tag) + '">' + escapeHtml(doc.tag) + '</span><span class="doc-meta-item">' + doc.lines + ' 行</span></div>' +
                  '<h3 class="module-card-title">' + escapeHtml(doc.title) + '</h3>' +
                  '<p class="module-card-copy">' + escapeHtml(doc.description) + '</p>' +
                  '<div class="module-card-path">' + escapeHtml(doc.path) + '</div>' +
                  '<div class="module-card-foot"><span>' + escapeHtml(doc.group) + '</span><span class="module-card-arrow">→</span></div>' +
                '</a>';
              }).join("") +
            '</section>' +
            '<section class="boundary">' +
              '<div class="boundary-panel"><h3>阅读边界</h3><p>Skill 正文和 references 在构建阶段嵌入浏览器。公开来源链接可以打开。</p></div>' +
              '<div class="boundary-panel"><h3>按需加载</h3><ul class="boundary-list"><li>IAA 默认作为主线</li><li>IAP 只在明确询问或混合变现时读取</li><li>来源库用于事实核对和引用追溯</li></ul></div>' +
            '</section>' +
          '</div>';
      }

      function renderSearch() {
        var query = state.query.trim().toLowerCase();
        var matches = docs.filter(function (doc) {
          return (doc.title + " " + doc.description + " " + doc.content).toLowerCase().indexOf(query) !== -1;
        });
        main.innerHTML = '<div class="search-results"><div class="eyebrow"><span class="eyebrow-line"></span>Search</div>' +
          '<h1 class="doc-title">搜索结果</h1><p class="search-summary">“' + escapeHtml(state.query.trim()) + '”匹配 ' + matches.length + ' 个文件</p>' +
          '<div class="result-list">' +
          (matches.length ? matches.map(function (doc) {
            var lower = doc.content.toLowerCase();
            var position = lower.indexOf(query);
            var start = Math.max(0, position - 70);
            var snippet = doc.content.slice(start, start + 190).replace(/\s+/g, " ");
            return '<a class="result-item" href="#module/' + doc.id + '" data-view="' + doc.id + '">' +
              '<span class="' + tagClass(doc.tag) + '">' + escapeHtml(doc.tag) + '</span>' +
              '<h2 class="result-title">' + escapeHtml(doc.title) + '</h2>' +
              '<p class="result-snippet">' + escapeHtml(snippet) + '…</p></a>';
          }).join("") : '<div class="empty-state">没有找到匹配内容。试试广告位、Waterfall、LTV、付费墙或来源编号。</div>') +
          '</div></div>';
      }

      function renderSourceCard(source) {
        return '<a class="source-card" href="' + source.url + '" target="_blank" rel="noopener">' +
          '<div class="source-id">' + escapeHtml(source.id) + '</div>' +
          '<div class="source-name">' + escapeHtml(source.title) + '</div>' +
          '<div class="source-scope">' + escapeHtml(source.scope) + '</div></a>';
      }

      function renderInspector(doc) {
        if (!doc) {
          inspector.innerHTML = '<h2 class="inspector-title">来源库</h2><p class="inspector-copy">公开来源、引用编号和原始页面链接集中在这里。</p>' +
            '<div class="inspector-section"><h3>来源总数</h3><p class="source-empty">' + sources.length + ' 个公开来源，点击卡片可打开原始页面。</p></div>' +
            sources.slice(0, 6).map(renderSourceCard).join("");
          return;
        }
        var ids = citationIds(doc.content);
        var cited = ids.map(function (id) { return sourceMap[id]; }).filter(Boolean);
        var headings = visibleHeadings(doc);
        inspector.innerHTML = '<h2 class="inspector-title">当前章节</h2><p class="inspector-copy">' + escapeHtml(doc.description) + '</p>' +
          (headings.length ? '<div class="inspector-section"><h3>章节提纲</h3><div class="inspector-outline">' +
          headings.slice(0, 18).map(function (heading) {
            return '<button type="button" data-heading="' + escapeHtml(heading) + '">' + escapeHtml(heading) + '</button>';
          }).join("") + '</div></div>' : '') +
          '<div class="inspector-section"><h3>引用来源 · ' + cited.length + '</h3>' +
          (cited.length ? cited.map(renderSourceCard).join("") : '<p class="source-empty">本章节以 GEN 结构性方法或 Skill 流程整理为主，没有单一公开来源。</p>') +
          '</div>';
      }

      function renderDoc(doc) {
        if (!doc) { renderOverview(); renderInspector(null); return; }
        var ids = citationIds(doc.content);
        var headings = visibleHeadings(doc);
        var articleClass = /\.json$/i.test(doc.path) ? "article json-article" : "article";
        main.innerHTML = '<div class="content-width">' +
          '<section class="doc-header"><div class="eyebrow"><span class="eyebrow-line"></span>' + escapeHtml(doc.group) + '</div>' +
          '<h1 class="doc-title">' + escapeHtml(doc.title) + '</h1><p class="doc-description">' + escapeHtml(doc.description) + '</p>' +
          '<div class="doc-meta"><span class="' + tagClass(doc.tag) + '">' + escapeHtml(doc.tag) + '</span><span class="doc-meta-item">' + doc.lines + ' 行</span><span class="doc-meta-item">' + ids.length + ' 个引用编号</span><span class="doc-meta-item">' + escapeHtml(doc.path) + '</span></div>' +
          '<div class="outline-row">' + headings.slice(0, 12).map(function (heading) { return '<span class="outline-chip">' + escapeHtml(heading) + '</span>'; }).join("") + '</div></section>' +
          '<article class="' + articleClass + '">' + renderDocumentBody(doc) + '</article></div>';
        renderInspector(doc);
      }

      function render() {
        renderNav();
        if (state.query.trim()) { renderSearch(); renderInspector(null); }
        else if (state.sourceMode || state.view === "public-sources") {
          main.innerHTML = '<div class="content-width"><section class="doc-header"><div class="eyebrow"><span class="eyebrow-line"></span>公开来源</div><h1 class="doc-title">来源库</h1><p class="doc-description">公开页面、引用编号和原始 URL。点击任意卡片打开原始页面。</p><div class="doc-meta"><span class="pill orange">' + sources.length + ' 个来源</span><span class="doc-meta-item">页面核验由构建阶段完成</span></div></section><div class="source-grid">' + sources.map(renderSourceCard).join("") + '</div></div>';
          inspector.innerHTML = '<h2 class="inspector-title">来源说明</h2><p class="inspector-copy">官方平台文档优先；第三方报告只做方向性参考；原始 URL 是事实核对入口。</p>';
        } else if (state.view === "overview") { renderOverview(); renderInspector(null); }
        else { renderDoc(docById(state.view)); }
      }

      function readHash() {
        var hash = window.location.hash.replace(/^#/, "");
        if (hash.indexOf("module/") === 0) {
          state.view = hash.slice(7) || "overview";
          state.sourceMode = state.view === "public-sources";
        } else {
          state.view = "overview";
          state.sourceMode = false;
        }
        render();
      }

      nav.addEventListener("click", function (event) {
        var button = event.target.closest("[data-view]");
        if (!button) { return; }
        window.location.hash = "module/" + button.getAttribute("data-view");
      });
      main.addEventListener("click", function (event) {
        var headingLink = event.target.closest("[data-heading-link]");
        if (headingLink) {
          event.preventDefault();
          var wanted = headingLink.getAttribute("data-heading-link");
          var headings = main.querySelectorAll(".article h1, .article h2, .article h3, .article h4");
          for (var headingIndex = 0; headingIndex < headings.length; headingIndex += 1) {
            if (headings[headingIndex].textContent.trim() === wanted) {
              headings[headingIndex].scrollIntoView({ behavior: "smooth", block: "start" });
              break;
            }
          }
          return;
        }
        var target = event.target.closest("[data-view]");
        if (target) {
          event.preventDefault();
          window.location.hash = "module/" + target.getAttribute("data-view");
        }
      });
      inspector.addEventListener("click", function (event) {
        var target = event.target.closest("[data-heading]");
        if (!target) { return; }
        var headingText = target.getAttribute("data-heading");
        var headings = main.querySelectorAll(".article h1, .article h2, .article h3, .article h4");
        for (var i = 0; i < headings.length; i += 1) {
          if (headings[i].textContent.trim() === headingText) {
            headings[i].scrollIntoView({ behavior: "smooth", block: "start" });
            break;
          }
        }
      });
      searchInput.addEventListener("input", function (event) {
        state.query = event.target.value;
        render();
      });
      sourceToggle.addEventListener("click", function () {
        searchInput.value = "";
        state.query = "";
        window.location.hash = "module/public-sources";
      });
      themeToggle.addEventListener("click", function () {
        var current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
        setTheme(current === "dark" ? "light" : "dark", true);
      });
      document.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          searchInput.focus();
        }
        if (event.key === "Escape" && document.activeElement === searchInput) {
          searchInput.value = "";
          state.query = "";
          render();
        }
      });
      window.addEventListener("hashchange", readHash);
      readHash();
    }());
  </script>
</body>
</html>
