<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>App Monetization Expert · Skill Browser</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("app-monetization-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (error) {}
    }());
  </script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e7f0ec;
      --muted: #a4b3ac;
      --soft: #0c1512;
      --line: #2b3b35;
      --line-strong: #455850;
      --paper: #17231f;
      --sidebar: #111c18;
      --inspector: #111b18;
      --teal: #6fe0cf;
      --teal-soft: #123c36;
      --orange: #f1a17e;
      --orange-soft: #3b2a23;
      --blue: #9dc4ff;
      --blue-soft: #1e3048;
      --violet: #d0b1ef;
      --violet-soft: #382c47;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
      --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.25);
      --brand-ink: #07120f;
      --placeholder: #7f968d;
      --sidebar-heading: #81938b;
      --nav-ink: #c4d3cc;
      --nav-index: #7f9289;
      --nav-meta: #85978e;
      --hover-wash: rgba(255, 255, 255, .06);
      --wash: rgba(255, 255, 255, .04);
      --path: #87928d;
      --foot: #8a9691;
      --boundary-ink: #c4d3cc;
      --meta: #87928d;
      --outline-ink: #b0c1b8;
      --blockquote-ink: #b8d8d0;
      --blockquote-bg: #173b35;
      --code-ink: #ffc0a1;
      --pre-ink: #e9f5f0;
      --pre-bg: #0b1210;
      --inspector-heading: #8fa39a;
      --inspector-button: #a8b9b1;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --ink: #1c2a25;
      --muted: #5e6f67;
      --soft: #f2f6f4;
      --line: #d5e0db;
      --line-strong: #a9bcb3;
      --paper: #ffffff;
      --sidebar: #edf3f0;
      --inspector: #f6f9f7;
      --teal: #087f72;
      --teal-soft: #d9f0ec;
      --orange: #a84f28;
      --orange-soft: #fae9df;
      --blue: #2c6095;
      --blue-soft: #e3effa;
      --violet: #6a4b89;
      --violet-soft: #eee6f7;
      --shadow: 0 12px 32px rgba(37, 66, 56, .13);
      --shadow-soft: 0 4px 16px rgba(37, 66, 56, .1);
      --brand-ink: #06251f;
      --placeholder: #71847b;
      --sidebar-heading: #5f746b;
      --nav-ink: #3c5149;
      --nav-index: #71837a;
      --nav-meta: #70837a;
      --hover-wash: rgba(31, 80, 66, .08);
      --wash: rgba(31, 80, 66, .06);
      --path: #687c73;
      --foot: #61756c;
      --boundary-ink: #3c5149;
      --meta: #687c73;
      --outline-ink: #52665d;
      --blockquote-ink: #24574f;
      --blockquote-bg: #e5f3ef;
      --code-ink: #93401f;
      --pre-ink: #e9f5f0;
      --pre-bg: #1c2b26;
      --inspector-heading: #63786f;
      --inspector-button: #52675f;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--soft); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--soft);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.65;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--teal); }

    .app-shell { min-height: 100vh; }
    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 28px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 250px;
      color: inherit;
      text-decoration: none;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--brand-ink);
      background: var(--teal);
      border-radius: 7px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .05em;
    }
    .brand-title { display: block; font-size: 15px; font-weight: 760; letter-spacing: .01em; }
    .brand-subtitle { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .topbar-spacer { flex: 1; }
    .search-box {
      width: min(360px, 32vw);
      height: 38px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 7px;
      transition: border-color .2s, background .2s;
    }
    .search-box:focus-within { border-color: var(--teal); background: var(--paper); }
    .search-label { flex: 0 0 auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .search-box input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
    }
    .search-box input::placeholder { color: var(--placeholder); }
    .theme-toggle,
    .source-toggle {
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 14px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      white-space: nowrap;
    }
    .theme-toggle { width: 38px; padding: 0; }
    .theme-toggle:hover,
    .source-toggle:hover { border-color: var(--teal); color: var(--teal); }
    .theme-icon { font-size: 16px; line-height: 1; }

    .workspace {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr) 286px;
      min-height: calc(100vh - 72px);
    }
    .sidebar {
      padding: 22px 14px 18px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }
    .sidebar-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 10px 13px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .sidebar-count { color: var(--teal); font-size: 12px; letter-spacing: 0; }
    .nav-group { margin: 16px 0 5px; }
    .nav-group-title {
      padding: 0 10px 7px;
      color: var(--sidebar-heading);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .06em;
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 10px;
      text-align: left;
      color: var(--nav-ink);
      background: transparent;
      border: 0;
      border-radius: 6px;
      line-height: 1.35;
    }
    .nav-item:hover { background: var(--hover-wash); color: var(--ink); }
    .nav-item.active { color: var(--teal); background: var(--paper); box-shadow: var(--shadow-soft); }
    .nav-index {
      flex: 0 0 23px;
      color: var(--nav-index);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      padding-top: 1px;
    }
    .nav-item.active .nav-index { color: var(--teal); }
    .nav-copy { min-width: 0; }
    .nav-title { display: block; font-size: 13px; font-weight: 650; }
    .nav-meta { display: block; color: var(--nav-meta); font-size: 10px; margin-top: 2px; }
    .sidebar-foot {
      margin: 26px 8px 0;
      padding: 12px 11px;
      color: var(--muted);
      background: var(--wash);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.55;
    }
    .sidebar-foot strong { color: var(--ink); display: block; margin-bottom: 3px; }

    .main {
      min-width: 0;
      padding: 36px clamp(24px, 4vw, 68px) 80px;
      background: var(--paper);
      overflow: hidden;
    }
    .content-width { max-width: 1000px; margin: 0 auto; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .eyebrow-line { width: 24px; height: 1px; background: var(--teal); }
    .hero-title {
      max-width: 760px;
      margin: 12px 0 12px;
      font-size: clamp(30px, 4vw, 49px);
      line-height: 1.13;
      letter-spacing: -.02em;
    }
    .hero-lede {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }
    .hero-note {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 9px;
      color: var(--teal);
      background: var(--teal-soft);
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }
    .pill.orange { color: var(--orange); background: var(--orange-soft); }
    .pill.blue { color: var(--blue); background: var(--blue-soft); }
    .pill.violet { color: var(--violet); background: var(--violet-soft); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 34px 0 34px;
    }
    .metric {
      padding: 16px 17px 15px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
    }
    .metric-value {
      display: block;
      color: var(--ink);
      font-size: 26px;
      font-weight: 760;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .metric-label { display: block; color: var(--muted); font-size: 11px; margin-top: 8px; }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 18px;
      margin: 38px 0 14px;
    }
    .section-heading h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 12px; }

    .architecture {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }
    .architecture-step {
      position: relative;
      min-height: 128px;
      padding: 17px 17px 16px;
      background: var(--paper);
      border-right: 1px solid var(--line);
    }
    .architecture-step:last-child { border-right: 0; }
    .architecture-step::after {
      content: "→";
      position: absolute;
      top: 46px;
      right: -9px;
      z-index: 2;
      width: 17px;
      height: 17px;
      color: var(--teal);
      background: var(--paper);
      text-align: center;
      line-height: 15px;
      font-size: 15px;
    }
    .architecture-step:last-child::after { display: none; }
    .architecture-kicker { color: var(--teal); font-size: 11px; font-weight: 760; }
    .architecture-title { margin: 8px 0 5px; font-size: 14px; font-weight: 760; }
    .architecture-copy { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .module-card {
      min-height: 145px;
      display: flex;
      flex-direction: column;
      padding: 17px 18px;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 7px;
      text-decoration: none;
      transition: transform .18s, box-shadow .18s, border-color .18s;
    }
    .module-card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-soft); }
    .module-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .module-card-title { margin: 11px 0 5px; font-size: 15px; font-weight: 740; }
    .module-card-copy { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .module-card-path { margin-top: 7px; color: var(--path); font-size: 10px; line-height: 1.35; overflow-wrap: anywhere; }
    .module-card-foot { display: flex; align-items: center; gap: 9px; margin-top: auto; padding-top: 14px; color: var(--foot); font-size: 11px; }
    .module-card-arrow { margin-left: auto; color: var(--teal); font-size: 16px; }

    .boundary {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
      margin-top: 30px;
    }
    .boundary-panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
    }
    .boundary-panel h3 { margin: 0 0 10px; font-size: 14px; }
    .boundary-panel p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .boundary-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .boundary-list li { display: flex; gap: 9px; color: var(--boundary-ink); font-size: 12px; line-height: 1.5; }
    .boundary-list li::before { content: "•"; color: var(--teal); font-weight: 800; }

    .doc-header {
      padding-bottom: 26px;
      border-bottom: 1px solid var(--line);
    }
    .doc-title { margin: 10px 0 7px; font-size: clamp(26px, 3.2vw, 39px); line-height: 1.18; letter-spacing: -.02em; }
    .doc-description { max-width: 720px; margin: 0; color: var(--muted); font-size: 14px; }
    .doc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 15px; }
    .doc-meta-item { color: var(--meta); font-size: 11px; }
    .outline-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 15px; }
    .outline-chip {
      padding: 3px 7px;
      color: var(--outline-ink);
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 10px;
    }

    .article {
      max-width: 860px;
      padding-top: 28px;
      color: var(--ink);
      font-size: 14px;
    }
    .article h1 { display: none; }
    .article h2 { margin: 34px 0 12px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 21px; }
    .article > h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
    .article h3 { margin: 24px 0 9px; color: var(--ink); font-size: 16px; }
    .article h4 { margin: 18px 0 7px; font-size: 14px; }
    .article h1, .article h2, .article h3, .article h4 { scroll-margin-top: 88px; }
    .article p { margin: 10px 0; }
    .article blockquote {
      margin: 15px 0;
      padding: 12px 15px;
      color: var(--blockquote-ink);
      background: var(--blockquote-bg);
      border-left: 3px solid var(--teal);
    }
    .article ul, .article ol { margin: 10px 0 14px; padding-left: 22px; }
    .article li { margin: 4px 0; }
    .article code {
      padding: 1px 4px;
      color: var(--code-ink);
      background: var(--orange-soft);
      border-radius: 3px;
      font-size: .92em;
    }
    .article pre {
      overflow: auto;
      margin: 14px 0;
      padding: 14px 16px;
      color: var(--pre-ink);
      background: var(--pre-bg);
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.6;
    }
    .article pre code { padding: 0; color: inherit; background: transparent; }
    .article.json-article { max-width: 100%; }
    .article .json-view {
      margin-top: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      tab-size: 2;
    }
    .article table {
      width: 100%;
      margin: 15px 0 19px;
      border-collapse: collapse;
      font-size: 12px;
    }
    .article th, .article td {
      padding: 9px 10px;
      border: 1px solid var(--line);
      vertical-align: middle;
      text-align: left;
    }
    .article th { color: var(--ink); background: var(--soft); font-weight: 750; }
    .article a { text-decoration: underline; text-underline-offset: 2px; }
    .article a.citation-link { color: var(--teal); font-weight: 700; text-decoration: none; }
    .article a.citation-link:hover { text-decoration: underline; }
    .article hr { margin: 24px 0; border: 0; border-top: 1px solid var(--line); }

    .inspector {
      min-width: 0;
      padding: 24px 18px;
      background: var(--inspector);
      border-left: 1px solid var(--line);
      overflow-y: auto;
    }
    .inspector-title { margin: 0 0 6px; font-size: 12px; font-weight: 780; letter-spacing: .06em; text-transform: uppercase; }
    .inspector-copy { margin: 0 0 18px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .inspector-section { margin: 24px 0 0; }
    .inspector-section h3 { margin: 0 0 9px; color: var(--inspector-heading); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
    .inspector-outline { display: grid; gap: 4px; }
    .inspector-outline button {
      padding: 5px 7px;
      color: var(--inspector-button);
      text-align: left;
      background: transparent;
      border: 0;
      border-left: 2px solid transparent;
      font-size: 11px;
    }
    .inspector-outline button:hover { color: var(--teal); border-left-color: var(--teal); }
    .source-card {
      display: block;
      margin: 8px 0;
      padding: 10px;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      text-decoration: none;
    }
    .source-card:hover { border-color: var(--teal); }
    .source-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 1000px;
      margin: 22px auto 0;
    }
    .source-grid .source-card { margin: 0; min-width: 0; }
    .source-id { color: var(--teal); font-size: 10px; font-weight: 780; letter-spacing: .04em; }
    .source-name { margin-top: 3px; color: var(--ink); font-size: 12px; font-weight: 690; line-height: 1.35; }
    .source-scope { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .source-empty { color: var(--muted); font-size: 11px; line-height: 1.55; }

    .search-results { max-width: 900px; margin: 0 auto; }
    .search-summary { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .result-list { display: grid; gap: 10px; }
    .result-item {
      display: block;
      padding: 15px 17px;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 7px;
      text-decoration: none;
    }
    .result-item:hover { border-color: var(--teal); box-shadow: var(--shadow-soft); }
    .result-title { margin: 5px 0; font-size: 15px; font-weight: 740; }
    .result-snippet { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }

    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 220px minmax(0, 1fr); }
      .inspector { display: none; }
      .brand { min-width: 210px; }
    }
    @media (max-width: 760px) {
      .topbar { height: auto; min-height: 64px; flex-wrap: wrap; gap: 10px 12px; padding: 12px 16px; }
      .brand { flex: 1 1 auto; min-width: 0; }
      .brand-title { font-size: 14px; }
      .brand-subtitle { display: none; }
      .topbar-spacer { display: none; }
      .search-box { order: 3; width: 100%; }
      .source-toggle { order: 2; padding: 0 10px; }
      .workspace { display: block; min-height: calc(100vh - 112px); }
      .sidebar {
        padding: 10px 12px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        overflow-y: hidden;
      }
      .sidebar-head { display: none; }
      .nav {
        display: flex;
        gap: 7px;
        min-width: max-content;
      }
      .nav-group { display: contents; }
      .nav-group-title { display: none; }
      .nav-item {
        width: auto;
        min-height: 34px;
        align-items: center;
        padding: 7px 9px;
        background: var(--paper);
        border: 1px solid var(--line);
      }
      .nav-item.active { border-color: var(--teal); }
      .nav-index, .nav-meta { display: none; }
      .nav-title { font-size: 11px; white-space: nowrap; }
      .sidebar-foot { display: none; }
      .main { padding: 27px 17px 60px; }
      .hero-title { font-size: 31px; }
      .hero-lede { font-size: 14px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 25px 0; }
      .metric { padding: 13px; }
      .metric-value { font-size: 22px; }
      .architecture { grid-template-columns: 1fr 1fr; }
      .architecture-step { min-height: 120px; border-bottom: 1px solid var(--line); }
      .architecture-step:nth-child(2) { border-right: 0; }
      .architecture-step:nth-child(2)::after { display: none; }
      .architecture-step:nth-child(3), .architecture-step:nth-child(4) { border-bottom: 0; }
      .architecture-step:nth-child(3)::after { display: none; }
      .module-grid, .boundary { grid-template-columns: 1fr; }
      .source-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .section-heading { display: block; }
      .section-heading p { margin-top: 3px; }

  <script>
    window.SKILL_DATA = {"generatedAt":"2026-08-05 14:08","skillName":"app-monetization-expert","docs":[{"id":"skill","path":"SKILL.md","title":"入口与规则","group":"入口","tag":"Core","description":"触发条件、运行边界、知识路由、判断规则和输出结构","kind":"entry","lines":91,"headings":["App Monetization Expert","定位与边界","工作流程","参考文件路由","TopOn 报表分析工作流","判断规则","输出规范"],"content":"---\nname: app-monetization-expert\ndescription: 以 IAA 为主线的应用商业化设计、广告聚合配置、上线验收、收益诊断、实验迭代、TopOn CSV/TSV/XLSX/XLSM 报表分析、买量回收和产品研究 Skill；按需保留 IAP 的订阅、付费墙、定价、续订、LTV 和退款常识。用户讨论应用内广告、广告位、填充、展示、eCPM、TopOn、MAX、AdMob、TopOn 报表、数据质量、漏斗诊断、商业化配置、收益波动或 IAA/IAP 混合变现时使用。\n---\n\n# App Monetization Expert\n\nversion: 1.1.0\n\n## 定位与边界\n\n默认先处理 IAA。先还原产品任务和广告展示链路，再判断流量、填充、价格和收益。用户提供 TopOn CSV、TSV、XLSX 或 XLSM 报表时，先走 TopOn 报表分析流程；只有用户明确询问 IAP 或混合变现时，才读取 IAP 参考。\n\n运行时可以读取本目录中的参考文件，也可以联网访问 references/public-sources.md 中登记的公开资料以核对时效性；构建完成后不得再访问受限构建来源。不要把内部标识、原始业务材料、用户报表、原始响应或真实凭据写入答案。\n\n## 工作流程\n\n1. 将问题归类为设计、配置、上线、诊断、实验、报表分析、买量回收或产品研究。\n2. 固定应用、版本、地区、用户阶段、广告位、广告形式、流量组、广告源、时间和数据口径。\n3. 先确认用户是否到达广告场景，再按“触发 → 请求 → 响应/填充 → 可展示 → 展示”定位；收益问题拆成展示量与 eCPM。\n4. 若输入是报表，先识别类型、标准化字段、审计质量和证据等级，再进行归因或建议。\n5. 输出证据、异常节点、最小改动、观察指标、体验护栏和回退条件。\n6. 新应用或新配置必须经过发行前准备、需求确认、平台配置、参数验收、正式启用、复盘调整六阶段。\n\n## 参考文件路由\n\n| 问题 | 读取文件 |\n|:---:|:---|\n| IAA 收益模型、广告形式、场景、分组和体验边界 | [references/iaa-foundations.md](references/iaa-foundations.md) |\n| 新应用接入、平台配置、参数验收、启用、复盘和回退 | [references/iaa-launch-and-platform-configuration.md](references/iaa-launch-and-platform-configuration.md) |\n| 数据口径、三条漏斗、收益树、波动诊断和实验复盘 | [references/iaa-measurement-and-iteration.md](references/iaa-measurement-and-iteration.md) |\n| TopOn 入口、任务路由、证据边界和一键分析 | [references/topn-analysis.md](references/topn-analysis.md) |\n| TopOn 报表类型、字段口径、公式、可加性和数据质量 | [references/topn/data-contract.md](references/topn/data-contract.md)、[references/topn/metric-catalog.json](references/topn/metric-catalog.json)、[references/topn/report-types.json](references/topn/report-types.json) |\n| TopOn 证据等级、窗口选择、实验门槛和建议流程 | [references/topn/adaptive-evidence-thresholds.md](references/topn/adaptive-evidence-thresholds.md)、[references/topn/evidence-and-guardrails.md](references/topn/evidence-and-guardrails.md)、[references/topn/recommendation-workflow.md](references/topn/recommendation-workflow.md) |\n| TopOn 报表批处理、标准化、质量审计和 Data Analytics 交接 | [scripts/topn/run_topn_analysis.py](scripts/topn/run_topn_analysis.py)、[scripts/topn/inspect_topon_report.py](scripts/topn/inspect_topon_report.py)、[scripts/topn/audit_topn_data.py](scripts/topn/audit_topn_data.py)、[scripts/topn/build_data_analytics_artifact.py](scripts/topn/build_data_analytics_artifact.py) |\n| TopOn 帮助中心文本快照和本地检索 | [references/topn/topon-help/index.json](references/topn/topon-help/index.json)、[scripts/topn/search_topon_docs.py](scripts/topn/search_topon_docs.py) |\n| TopOn 分析报告和实验计划输出模板 | [references/topn/report-output.md](references/topn/report-output.md)、[assets/topn/analysis-report-template.md](assets/topn/analysis-report-template.md)、[assets/topn/experiment-plan-template.md](assets/topn/experiment-plan-template.md) |\n| 买量回收、CAC、LTV、ROAS、归因和放量 | [references/user-acquisition-and-payback.md](references/user-acquisition-and-payback.md) |\n| 市场筛选、AppMagic、产品拆解和匿名案例 | [references/product-research-and-cases.md](references/product-research-and-cases.md) |\n| IAP 指标、付费漏斗、续订、流失、退款和诊断 | [references/iap-metrics-funnel-diagnostics.md](references/iap-metrics-funnel-diagnostics.md) |\n| IAP 付费墙、定价、试用、商店机制、运营和合规 | [references/iap-paywall-pricing-ops.md](references/iap-paywall-pricing-ops.md) |\n| 公开来源、引用编号、页面标题、原始 URL 和来源层级 | [references/public-sources.md](references/public-sources.md) |\n\n混合变现问题至少读取一份相关 IAA 文件和一份相关 IAP 文件，并分别说明广告收益、付费价值和体验影响。\n\n## TopOn 报表分析工作流\n\n支持 CSV、TSV、XLSX 和 XLSM。用户声明数据为现实业务数据时使用 `observed`；明确只作字段或流程样例时使用 `fixture`。fixture 的证据等级固定为 D，不得形成现实归因或具体配置建议。\n\n在 Skill 根目录运行：\n\n```powershell\npython scripts/topn/run_topn_analysis.py \u003c报表或目录\u003e --project \u003c项目名\u003e --trust-status observed --surface report\n```\n\n该入口依次识别综合、漏斗或聚合管理报表，映射规范字段，隔离汇总行和混合粒度，生成 Data Analytics artifact，审计完整性/唯一性/有效性/一致性/时间连续性，评估 7、14、28、56 日自适应证据窗口，并输出 `analysis-manifest.json`。单独检查结构时运行 `python scripts/topn/inspect_topon_report.py \u003creport.xlsx\u003e --output \u003cinspection.json\u003e`；字段无法映射时显式提供 `规范字段 -\u003e 原始列名` JSON，不让分析工具猜列名或粒度。\n\n现实数据的主要结论只能由 `[观测]` 和 `[计算]` 支持；TopOn 帮助中心属于 `[文档]`，未排除的原因属于 `[推断]`，拟验证动作属于 `[建议]`。结论同时标注 A/B/C/D：D 或质量 `blocked` 时停止归因和配置建议，质量 `limited` 时关键结论不超过 C 级。不要设置统一 DAU 门槛，按实际分母、历史噪声、完整窗口和业务最小变化判断证据强度。\n\n分析现实数据时必须把 `data-quality.json`、`evidence-evaluation.json` 和 `data-analytics-artifact.json` 交给 Data Analytics：质量问题走 `analyze-data-quality`，指标变化走 `metric-diagnostics`，策略取舍走 `product-business-analysis`，需要交付报告走 `build-report`。TopOn Open API 的鉴权和采集仍显式交给独立的 `$topn-open-api`，不得在本 Skill 中处理密钥或绕过采集边界。\n\n## 判断规则\n\n- 分开写事实、假设、建议和待验证项；证据不足时给验证方法，不补造行业阈值。\n- TopOn 报表结论按 `[文档]`、`[观测]`、`[计算]`、`[推断]`、`[建议]`区分信息角色，并写明证据等级。\n- 涉及公开平台事实时使用来源注册表的编号和原始链接；注明官方、平台文档、第三方报告或通用方法。\n- 比较数据时固定时间、版本、地区、用户阶段、广告位和统计口径。\n- 客户端事件、聚合估算、广告源回传、结算数据和归因数据不能直接混算。\n- `estimated_revenue` 是 TopOn 预估收益，`revenue_api` 是第三方广告平台报表收益；`impressions` 是 TopOn SDK 展示回调，`impressions_api` 是第三方平台报表展示，二者只做对账。\n- `estimated_ecpm = estimated_revenue / impressions * 1000`；ARPDAU、填充率、展示率、竞价响应率和竞胜率必须从规范分子/分母重算，不能平均行级比率。\n- DAU、DEU、留存率、ARPU、ARPDAU、eCPM 和比率不能跨重复粒度直接求和；聚合管理报表的 Total 行请求与广告源明细请求不能混合。\n- 当前周期与基线周期必须覆盖相同数量的完整自然日；缺失、接口未返回和真实零值必须区分。\n- 具体流量规则优先于宽泛规则；默认组必须能够承接未命中流量。\n- 调整前保存配置快照，一次只改一个主要变量，并提前写明观察范围、护栏和回退条件。\n- 不把单一案例的广告频率、地区、价格或表现当作通用规则。\n- 不依据只有不可读取内容或空模板的材料形成事实判断。\n\n## 输出规范\n\n诊断、TopOn 报表分析和优化建议按以下顺序输出：\n\n1. 结论：变化来自流量、广告链路、价格、口径或证据不足。\n2. 证据：指标、维度、版本、时间范围和数据来源。\n3. 定位：核心任务漏斗或广告漏斗的异常节点。\n4. 动作：最小可验证改动及执行顺序。\n5. 验证：生效检查、观察范围、体验护栏和回退条件。\n\nTopOn 报表交付还要写明数据范围、粒度、币种、时区、预估/结算口径、质量状态、证据等级、主要发现、贡献拆解、限制、建议实验和官方文档引用，并将“发生了什么”和“为什么发生”分开。\n\n配置流程按“输入、操作、检查、交付”表达。公开来源链接和加粗的“编号-中文标题”引用可以保留；不要输出人员、账户、项目、应用名、包名、真实标识、凭据、内部表格明细、原始业务数值或其他未授权内部材料。\n"},{"id":"iaa-foundations","path":"references/iaa-foundations.md","title":"IAA 基础与广告设计","group":"IAA 核心","tag":"Design","description":"收益模型、广告形式、广告位、流量分组和体验护栏","kind":"iaa","lines":71,"headings":["IAA 基础与广告设计","目录","收益模型","产品设计","广告形式和场景","广告位与埋点","流量分组","请求到展示链路","IAA 与 IAP 协同"],"content":"# IAA 基础与广告设计\n\n\u003e 来源：广告形式参考 **[IAA-CSJ-02-成长中心：广告样式]**；竞价、Waterfall、分组和展示链路参考 **[IAA-TOPON-04-头部竞价]** **[IAA-TOPON-05-Waterfall 结构]** **[IAA-TOPON-17-广告分层入门和优化技巧]**；收益公式、产品设计和体验护栏属于 GEN 结构性方法。\n\n## 目录\n\n- 收益模型\n- 产品设计\n- 广告形式和场景\n- 广告位与埋点\n- 流量分组\n- 请求到展示链路\n- IAA 与 IAP 协同\n\n## 收益模型\n\n广告收益 = 展示量 × eCPM / 1000\n\n展示量由用户是否到达场景、触发条件、请求、响应、可展示和实际展示共同决定；eCPM 受地区、用户阶段、广告形式、广告位和广告源结构影响。先拆展示量与价格，不从单一指标推断原因。\n\n## 产品设计\n\n| 层级 | 需要回答的问题 |\n|:---:|:---|\n| 用户分层 | 地区、用户阶段、使用频率、任务价值和付费倾向是否会改变广告策略 |\n| 功能切分 | 用户如何进入、操作、完成、失败、返回和再次启动 |\n| 广告嵌入 | 哪个稳定节点适合哪种广告，是否位于自然断点 |\n| 付费引导 | 去广告、高级功能、批量处理或额度是否提供真实持续价值 |\n| 体验平衡 | 首次任务、连续操作、语言、权限、关闭和核心控件是否被保护 |\n\n广告应服从核心任务。不要在任意点击、返回、切换应用时强制触发，也不要用强制广告伪装激励广告。插屏和启动广告要有频率、间隔、冷却和冷启动/热启动规则。\n\n## 广告形式和场景\n\n| 形式 | 常见适用节点 | 主要检查 |\n|:---:|:---|:---|\n| 启动广告 | 启动或恢复的可控加载阶段 | 首次体验、加载时间、冷却和重复触发 |\n| 插屏 | 任务完成、关卡结束、模块切换等自然断点 | 是否打断输入或执行、关闭后去向和频率 |\n| 横幅 | 布局稳定的长期曝光区域 | 遮挡、布局抖动、刷新和停留时长 |\n| 原生/信息流 | 内容列表、结果页、工具集合 | 样式区分、连续性和误触风险 |\n| 激励广告 | 额外资源、次数、临时能力或短期免广告 | 用户是否主动选择、权益是否即时且可兑现 |\n\n广告形式由任务阶段和用户容忍度决定；广告样式的公开分类可参照 **[IAA-CSJ-02-成长中心：广告样式]**。案例中的组合不能直接复制到其他品类。\n\n## 广告位与埋点\n\n1. 画出核心任务路径，标记页面、动作、结果和返回节点。\n2. 为候选节点记录广告形式、触发条件、广告位、流量组和频率规则。\n3. 将产品事件与广告事件分开：产品事件记录页面、动作和任务结果；广告事件记录请求、响应、可展示、展示、点击、关闭和失败。\n4. 记录失败阶段、错误、耗时、网络、版本和生效配置，保证问题可以复现。\n5. 先保护首次任务，再验证任务完成后的广告库存。\n\n## 流量分组\n\n- 主要地区或表现差异明显的地区可独立成组。\n- 长尾地区按相近表现合并，避免小样本过度拆分。\n- 新用户和返回用户使用统一且可由产品事件验证的判定口径。\n- 地区与用户阶段的组合规则排在单维度规则之前。\n- 默认组保留有效广告源和兜底，承接未命中特定规则的流量。\n- 上线后用真实用户分布和样本量修正初始分组，不把市场预估当作线上事实。\n\n## 请求到展示链路\n\n聚合平台通常将 Bidding、Waterfall 和兜底组合使用：竞价负责实时竞争，Waterfall 补充非竞价覆盖，兜底承接主链路未填充流量。相关对象和配置方法参照 **[IAA-TOPON-04-头部竞价]** **[IAA-TOPON-05-Waterfall 结构]** **[IAA-TOPON-17-广告分层入门和优化技巧]**。\n\n请求已发出但没有展示时，依次检查预加载、可展示状态、缓存有效期、页面生命周期、单平台超时、整体超时、并发覆盖和兜底是否真正生效。不能把所有展示失败都归因于预算或广告源价格。\n\n## IAA 与 IAP 协同\n\n混合变现时分别维护广告漏斗和付费漏斗。去广告 IAP 会减少广告库存，激励广告可以提供临时权益，IAP 应提供持续权益。评估方案时同时观察广告收益、付费净收入、留存、退款和核心任务完成。\n"},{"id":"iaa-launch-and-platform-configuration","path":"references/iaa-launch-and-platform-configuration.md","title":"IAA 配置、上线与平台操作","group":"IAA 核心","tag":"Workflow","description":"六阶段上线、聚合对象、参数映射、Bidding、Waterfall、兜底和验收","kind":"iaa","lines":283,"headings":["IAA 配置、上线与平台操作","目录","总体阶段","六阶段执行","阶段一：发行前准备","阶段二：需求确认","阶段三：平台配置","阶段四：参数回填与验收","阶段五：正式启用","阶段六：复盘与调整","流量分组","Bidding、Waterfall 和兜底","加载控制","平台语义","阶段门禁","验收、整改和自动化边界"],"content":"# IAA 配置、上线与平台操作\n\n\u003e 来源：本文件合并六阶段执行整理与聚合平台配置。上线流程标为 GEN-WORKFLOW；TopOn 对象、竞价、Waterfall、分组和报表参考 **[IAA-TOPON-01-聚合平台概况]** **[IAA-TOPON-02-价格和底价]** **[IAA-TOPON-04-头部竞价]** **[IAA-TOPON-05-Waterfall 结构]** **[IAA-TOPON-09-数据来源]** **[IAA-TOPON-18-头部竞价]** **[IAA-TOPON-19-聚合管理（Waterfall）报表数据说明]**；MAX 调试和网络接入参考 **[IAA-MAX-02-MAX 中介调试器]** **[IAA-MAX-03-MAX 传统聚合网络指南]**。不把内部工作流归因于单一公开页面。\n\n## 目录\n\n- 总体阶段\n- 六阶段执行\n- 平台配置对象和顺序\n- 参数映射\n- 流量分组\n- Bidding、Waterfall 和兜底\n- 加载控制\n- 平台语义\n- 阶段门禁\n- 验收、整改和自动化边界\n\n## 总体阶段\n\n| 阶段 | 主要操作 | 交付 |\n|:---:|:---|:---|\n| 发行前准备 | 评估产品、规模、地区、场景和埋点 | 场景清单、分组方案、埋点口径 |\n| 需求确认 | 核对产品、广告范围、平台和限制 | 配置清单、参数字段、验收条件 |\n| 平台配置 | 创建对象，配置广告源、分组、价格和兜底 | 对象映射、流量规则、配置版本 |\n| 参数回填与验收 | 回填参数，用测试包验证链路和规则 | 回填记录、测试证据、验收结论 |\n| 正式启用 | 核对范围，观察真实首轮流量 | 启用记录、分组结果、首轮检查 |\n| 复盘与调整 | 定位异常，单变量调整并保留回退 | 复盘结论、调整记录、回退方案 |\n\n上一阶段交付不完整时，不进入下一阶段。每一阶段都按输入、操作、检查、交付执行。\n\n## 六阶段执行\n\n### 阶段一：发行前准备\n\n#### 输入\n\n产品核心功能、目标用户、使用频率、预估规模、重点地区、候选广告场景和预计触发次数。\n\n#### 操作\n\n1. 还原核心功能和完整任务路径。\n2. 用活跃用户与单用户请求或展示预估初始规模。\n3. 形成地区、用户阶段、组合规则和默认组。\n4. 标记广告位置、形式、触发时机、频率和命中分组。\n5. 为产品节点、广告节点、频率条件和异常设计埋点。\n\n#### 检查\n\n- 产品定位、核心任务和广告策略一致。\n- 规模预估能由用户数和单用户触发次数解释。\n- 具体规则优先，默认组可承接未命中流量。\n- 产品链路和广告链路分开记录，关键节点可还原。\n\n#### 交付\n\n初始产品方案、广告场景清单、请求量预估、流量分组方案和埋点口径。\n\n### 阶段二：需求确认\n\n#### 输入\n\n结构化需求记录和阶段一交付。\n\n#### 操作\n\n1. 核对平台、配置环境、广告形式和广告源范围。\n2. 核对聚合方式、地区、用户阶段、命名要求和限制。\n3. 核对优先级、时间、当前状态和阻塞项。\n4. 检查字段一致性；缺失或冲突时退回补充，不猜测配置。\n5. 明确参数回填位置和验收方式。\n\n#### 检查\n\n- 产品信息能唯一对应目标应用，但交付不暴露真实标识。\n- 广告范围与候选场景一致。\n- 环境、聚合方式、分组和广告源范围无冲突。\n- 执行顺序和阻塞项明确。\n\n#### 交付\n\n确认后的配置清单、参数字段清单和验收条件。\n\n### 阶段三：平台配置\n\n#### 输入\n\n已确认的配置清单、广告场景清单和流量分组方案。\n\n#### 配置对象\n\n| 对象 | 作用 | 关系 |\n|:---:|:---|:---|\n| 应用对象 | 代表应用和平台环境 | 关联广告位或广告单元 |\n| 广告位/广告单元 | 承载一种形式和一组广告源 | 映射产品广告场景 |\n| 广告场景 | 表示具体触发位置 | 记录触发、频率和所属广告位 |\n| 广告源 | 提供需求和价格 | 进入竞价、Waterfall 或兜底 |\n| 流量分组 | 按地区、用户阶段等条件分流 | 决定广告源和价格组合 |\n| 配置版本 | 记录一次可回溯状态 | 关联启用、测试和复盘 |\n\n#### 操作\n\n1. 创建应用对象、广告位或广告单元。\n2. 将产品场景与广告位一一映射；新场景使用唯一且可追踪编号。\n3. 接入广告源，记录参数类型和启用状态。\n4. 配置地区、用户阶段、组合规则和默认组。\n5. 配置 Bidding、Waterfall、价格层级和兜底。\n6. 保存配置版本和参数映射，不保存真实凭据。\n\n推荐顺序（GEN-WORKFLOW，具体字段以平台当前页面为准）：\n\n1. 创建应用对象。\n2. 按广告形式和产品场景创建广告位或广告单元。\n3. 为新场景分配唯一且可追踪的编号。\n4. 接入广告源并记录参数类型。\n5. 配置地区、用户阶段、组合规则和默认组。\n6. 为各组配置竞价、Waterfall、价格和兜底。\n7. 回填参数、自检、测试，保存快照后启用。\n\n#### 检查\n\n- 应用、广告位、形式、场景和广告源无遗漏或重复。\n- 分组优先级正确，默认组有有效广告源和兜底。\n- 价格和覆盖同时存在，主链路失败仍有承接路径。\n\n#### 交付\n\n平台配置、对象映射、流量规则、广告源组合和配置版本记录。\n\n### 阶段四：参数回填与验收\n\n#### 输入\n\n平台配置、参数映射、广告控制规则和测试条件。\n\n#### 参数映射\n\n| 类别 | 记录内容 | 验证方式 |\n|:---:|:---|:---|\n| 应用 | 平台、环境、配置版本 | 与需求和测试包一致 |\n| 广告位 | 形式、用途、所属应用 | 与产品场景一一对应 |\n| 场景 | 触发位置、进入方式、控制规则 | 用产品事件和广告事件还原 |\n| 广告源 | 参数类型、来源平台、状态 | 平台侧与广告源侧交叉核对 |\n| 流量规则 | 地区、用户阶段、优先级、默认组 | 用测试或首轮真实流量验证 |\n| 加载控制 | 预加载、缓存、并发、超时、兜底 | 用链路事件和耗时验证 |\n\n#### 操作\n\n1. 将应用、广告位、广告单元、广告源和场景参数回填到配置系统。\n2. 回填广告形式、并发、超时、频次、间隔和用户分层规则。\n3. 完成录入侧自检，确认字段完整、映射一致。\n4. 用测试包验证请求、响应、可展示、展示、形式和关闭行为。\n5. 验证地区、用户阶段、频率、间隔和默认组规则。\n6. 将异常按平台配置、广告源、请求返回和 SDK 状态分层。\n\n#### 检查\n\n- 测试包接收的配置与平台记录一致。\n- 请求到展示链路完整，失败能定位到阶段。\n- 控制规则按预期生效。\n- 配置问题与 SDK 集成或版本兼容问题已经分开。\n\n#### 交付\n\n参数回填记录、测试证据、异常清单和验收结论。\n\n### 阶段五：正式启用\n\n#### 输入\n\n通过验收的配置、测试结论和启用范围。\n\n#### 操作\n\n1. 核对应用版本、广告位、地区范围、配置状态和启用时间。\n2. 记录启用范围与配置版本，保证后续可回溯。\n3. 检查真实流量是否进入预期地区和用户阶段。\n4. 检查默认组是否承接未命中特定规则的流量。\n5. 确认请求、响应、展示和收入已经产生。\n6. 按广告位、形式、平台、广告源、地区和版本拆分首轮数据。\n\n#### 检查\n\n- 启用范围、版本和配置状态准确。\n- 分组生效由配置记录和真实流量共同证明。\n- 首轮数据覆盖请求、展示和收益。\n\n#### 交付\n\n正式启用记录、分组生效结果和首轮数据检查结果。\n\n### 阶段六：复盘与调整\n\n#### 输入\n\n启用记录、首轮数据、当前配置快照和版本变化记录。\n\n#### 操作\n\n1. 在统一口径下按应用、广告位、地区、用户阶段、流量组和广告源查看请求、展示、eCPM 和收益。\n2. 先确认场景到达，再检查请求、响应、可展示、展示和耗时。\n3. 链路正常后再分析 eCPM、价格层级和广告源结构。\n4. 无请求、无展示、映射错误、广告源不可用或数据缺失时立即排查。\n5. 调整前保存快照，一次只改变一个主要变量。\n6. 记录影响范围、观察指标、体验护栏和回退条件。\n7. 证据不足时记录继续观察项，不把假设写成结论。\n\n#### 检查\n\n- 不同平台保持各自数据口径，不直接混合。\n- 调整变量与异常节点对应。\n- 观察范围和回退条件在调整前已确定。\n- 结论可追溯到数据、配置记录或观察依据。\n\n#### 交付\n\n复盘结论、异常定位、调整记录、观察结果和回退记录。\n\n## 流量分组\n\n- 先用少量、可解释的分组建立稳定配置，再根据真实数据增加粒度。\n- 主要地区或表现差异明显的地区可独立成组；长尾地区按相近表现合并。\n- 新用户和返回用户的判定字段必须统一，并能由产品事件验证。\n- 地区与用户阶段的组合规则排在单维度规则之前。\n- 默认组必须保留有效广告源和兜底，不能关闭或空置。\n- 规则变化后检查流量占比，避免优先级错误把流量导入意外分组。\n\n分组名称只是配置标签。规则、请求记录和真实流量共同证明是否生效。\n\n## Bidding、Waterfall 和兜底\n\n- Bidding 让支持竞价的广告源参与同次机会竞争。\n- Waterfall 按价格或策略层级补充非竞价覆盖。\n- 兜底在主链路没有可展示广告时承接剩余流量。\n\n配置时检查竞价组是否正确、Waterfall 层级是否与地区和形式匹配、提价是否造成填充或展示下降、低价层和兜底是否覆盖未填充流量，以及新增或移除广告源的增量贡献；平台层级和竞价行为可对照 **[IAA-TOPON-02-价格和底价]** **[IAA-TOPON-05-Waterfall 结构]** **[IAA-TOPON-17-广告分层入门和优化技巧]**。\n\n不要从单次 eCPM 上升推断总收益一定上升。价格调整必须同时观察展示量、填充和总收益。\n\n## 加载控制\n\n展示失败按以下顺序检查：\n\n1. 场景前是否发起预加载。\n2. 返回广告是否进入可展示状态。\n3. 缓存是否过期、被消费或与页面生命周期不一致。\n4. 单平台或整体超时是否过早放弃可用广告。\n5. 并发请求是否导致结果覆盖、重复消耗或请求未展示。\n6. 前后台切换、页面销毁和重复进入是否清理错误状态。\n\n每个阶段记录事件和耗时。只有请求与展示两个事件时，无法区分响应、缓存、可展示状态和页面问题；报表延迟、时区和展示字段可对照 **[IAA-TOPON-09-数据来源]** **[IAA-TOPON-19-聚合管理（Waterfall）报表数据说明]**。\n\n## 平台语义\n\n| 统一语义 | TopOn 常见对象 | MAX 常见对象 | AdMob 常见对象 |\n|:---:|:---|:---|:---|\n| 应用 | App | App | App |\n| 广告承载对象 | 广告位 | Ad Unit | Ad Unit |\n| 广告源组合 | 广告源与 Waterfall | Network 与 Waterfall | Mediation group 与广告源 |\n| 流量拆分 | 流量分组 | 国家或规则分组 | 中介组定向规则 |\n\n对照只用于理解对象关系。实际字段、能力和回传口径以当前配置记录和用户提供的数据为准。\n\n## 阶段门禁\n\n| 门禁 | 通过条件 |\n|:---:|:---|\n| 设计 | 核心任务、广告场景、分组和埋点对齐 |\n| 需求 | 字段完整一致，配置范围和验收方式明确 |\n| 配置 | 平台对象、广告源、分组、价格和兜底完整 |\n| 验收 | 参数映射一致，测试链路和控制规则符合预期 |\n| 启用 | 真实流量进入预期分组，首轮数据已经产生 |\n| 调整 | 异常范围、单一变量、护栏和回退条件明确 |\n\n## 验收、整改和自动化边界\n\n验收至少覆盖：参数映射、请求到展示事件、广告形式、频率、间隔、地区、用户阶段、默认组和兜底。配置问题、广告源状态问题和 SDK 集成问题要分层。\n\n变更前保存快照，写明原因、影响广告位、观察指标、体验护栏和回退条件；一次只改变一个主要变量。\n\n收到政策问题后，先整改真实展示行为并发布验证版本，再覆盖相关页面、关闭路径和目标广告场景，最后只陈述已完成且可证明的整改。复审文案不能代替整改。\n\n自动化适合对象创建、字段映射、批量校验、配置差异和报表整理。场景选择、体验边界、价格和广告源调整、启用范围及回退条件仍需人工确认。任何写入平台的动作都先展示拟变更对象和影响范围。\n"},{"id":"iaa-measurement-and-iteration","path":"references/iaa-measurement-and-iteration.md","title":"IAA 数据分析与迭代","group":"IAA 核心","tag":"Metrics","description":"数据口径、三条漏斗、收益树、诊断、实验和回退","kind":"iaa","lines":113,"headings":["IAA 数据分析与迭代","目录","数据口径","三条漏斗和收益树","诊断顺序","常见问题","证据和对比","实验和配置调整","调整前","调整中","调整后","复盘交付"],"content":"# IAA 数据分析与迭代\n\n\u003e 来源：数据来源、漏斗和收益拆解参考 **[IAA-TOPON-08-漏斗分析]** **[IAA-TOPON-09-数据来源]** **[IAA-TOPON-10-有效展示]** **[IAA-TOPON-11-收益变动分解]** **[IAA-TOPON-12-收益分析]**；公式、证据分类和实验纪律属于 GEN 结构性方法。\n\n## 目录\n\n- 数据口径\n- 三条漏斗和收益树\n- 诊断顺序\n- 常见问题\n- 证据和对比\n- 实验和复盘\n\n## 数据口径\n\n| 来源 | 适合回答 | 限制 |\n|:---:|:---|:---|\n| 客户端事件 | 用户是否到达场景、链路停在哪一步 | 依赖埋点和版本覆盖 |\n| 聚合 SDK/平台估算 | 请求、展示和分组的实时表现 | 可能有延迟或口径差异 |\n| 广告源回传 | 广告源侧展示、价格和收益 | 不一定包含完整产品链路 |\n| 结算数据 | 最终确认收入 | 时效较慢，可能含调整项 |\n| 归因数据 | 渠道、地区和用户获取表现 | 受窗口和匹配规则影响 |\n\n比较前记录时间、时区、币种、版本、去重、展示定义和回传延迟；TopOn 对 SDK 统计、网络回传、时区和延迟的区分参照 **[IAA-TOPON-09-数据来源]** **[IAA-TOPON-19-聚合管理（Waterfall）报表数据说明]**。不同口径不能直接相加，也不能用一张报表覆盖另一张。\n\n## 三条漏斗和收益树\n\n核心任务漏斗：\n\n进入应用 → 到达功能 → 开始任务 → 完成任务 → 结果或返回节点\n\nIAA 广告漏斗：\n\n场景到达 → 条件满足 → 请求 → 响应/填充 → 可展示 → 实际展示 → 点击或关闭\n\nIAP 付费漏斗：\n\n付费入口曝光 → 付费墙 → 套餐选择 → 购买 → 权益生效 → 续订或流失\n\n基础收益公式：\n\n广告收益 = 展示量 × eCPM / 1000\n\n展示量可拆为：\n\n活跃用户 × 单用户场景到达次数 × 触发满足率 × 请求成功率 × 响应/填充率 × 可展示率 × 实际展示率\n\nIPU 连接用户规模与展示量，eCPM 观察价格和流量结构，ARPDAU 同时反映展示和价格，总收益验证是否产生真实增量。缺少某个阶段字段时，明确记录证据缺口。\n\n## 诊断顺序\n\n1. 固定时间、版本、地区、用户阶段、广告位和数据口径。\n2. 判断活跃用户、核心任务到达和广告场景触发是否变化。\n3. 检查请求、响应、填充、可展示和实际展示。\n4. 链路正常后再分析 eCPM、广告源结构和价格层级。\n5. 用总收益、核心任务完成、留存和崩溃等护栏验证结论。\n\n## 常见问题\n\n| 现象 | 首要检查 |\n|:---:|:---|\n| 收益下降 | 先拆展示量下降与 eCPM 下降，分别沿任务漏斗和广告漏斗定位 |\n| 请求下降或消失 | 场景到达、触发条件、频率、版本、参数映射和 SDK 初始化 |\n| 填充下降 | 广告源状态、地区覆盖、价格层级、竞价返回、Waterfall 尾部和兜底 |\n| 响应正常但展示下降 | 预加载、缓存、可展示状态、页面生命周期、超时、并发和重复请求 |\n| eCPM 下降 | 固定地区、用户阶段、广告位和形式后比较广告源及价格层级 |\n| 报表不一致 | 时区、币种、日期边界、去重、展示定义、延迟和结算调整 |\n\n提高底价可能同时降低填充，eCPM 上升也不等于总收益上升；底价、填充和收益的联动可参照 **[IAA-TOPON-02-价格和底价]** **[IAA-TOPON-11-收益变动分解]**。任何判断都要回到同口径的总量和体验结果。\n\n## 证据和对比\n\n有效对比至少说明：\n\n- 时间范围、应用版本和配置版本。\n- 地区、用户阶段、流量组、广告位和广告源。\n- 数据来源、时区、币种和指标定义。\n- 样本量以及同期的发布、投放、渠道或产品变化。\n\n输出分成四类：已观察事实、支持性解释、待验证假设、建议动作。数据不足时补事件、日志或测试流量，不补造结论。\n\n## 实验和配置调整\n\n### 调整前\n\n1. 保存配置快照，写明目标指标和异常节点。\n2. 选择一个主要变量，固定受影响范围和流量比例。\n3. 定义收益、展示、任务完成、留存或崩溃护栏。\n4. 写明观察窗口、生效检查和回退条件。\n\n### 调整中\n\n保持版本、流量和口径可识别。出现无请求、无展示、参数错误、广告源不可用或数据缺失时，立即按异常处理。A/B 分配和口径问题可参照 **[IAA-TOPON-13-A/B 测试]**。\n\n### 调整后\n\n1. 确认配置真实生效。\n2. 先看漏斗节点，再看 eCPM 和收益。\n3. 检查目标分组的增量是否转移了其他分组的收益。\n4. 检查体验护栏，达到条件即恢复快照并记录原因。\n\n## 复盘交付\n\n| 项目 | 内容 |\n|:---:|:---|\n| 范围 | 时间、版本、地区、用户阶段、广告位、口径 |\n| 事实 | 指标变化和异常节点 |\n| 判断 | 流量、链路、价格、广告源或口径问题 |\n| 动作 | 已执行或拟执行的单变量调整 |\n| 验证 | 指标、观察范围、护栏和生效检查 |\n| 回退 | 条件、快照和执行结果 |\n| 缺口 | 事件、字段、样本或仍需观察范围 |\n"},{"id":"topn-analysis","path":"references/topn-analysis.md","title":"TopOn 报表分析模块","group":"TopOn 分析","tag":"TopOn","description":"报表识别、字段约束、证据等级、质量审计、实验和 Data Analytics 交接","kind":"topn","lines":128,"headings":["TopOn 报表分析模块","目录","任务路由","证据边界","一键处理报表","字段硬约束","Data Analytics 联动","帮助中心检索","策略建议与实验","项目状态","交付格式"],"content":"# TopOn 报表分析模块\n\n## 目录\n\n- [任务路由](#任务路由)\n- [证据边界](#证据边界)\n- [一键处理报表](#一键处理报表)\n- [字段硬约束](#字段硬约束)\n- [Data Analytics 联动](#data-analytics-联动)\n- [帮助中心检索](#帮助中心检索)\n- [策略建议与实验](#策略建议与实验)\n- [项目状态](#项目状态)\n- [交付格式](#交付格式)\n\nTopOn 是本 Skill 的 IAA 数据分析模块。它负责读取用户提供的报表、解释公开帮助中心口径、检查数据质量、定位漏斗和收益变化，并形成可回滚的验证方案；不负责 Open API 鉴权、密钥管理或数据采集。\n\n## 任务路由\n\n| 用户任务 | 执行方式 | 按需读取 |\n|---|---|---|\n| 解释指标、报表列或产品功能 | 搜索本地帮助中心并引用官方 URL | `references/topn/metric-catalog.json`、`references/topn/data-contract.md` |\n| 检查报表能否分析 | 识别类型、标准化字段、运行质量审计 | `references/topn/report-types.json`、`references/topn/data-contract.md` |\n| 概括变化或定位异常 | 比较等长完整窗口，拆解收入、展示和 eCPM | `references/topn/metrics-and-diagnostics.md` |\n| 判断结论可靠性 | 使用自适应窗口、历史噪声和实际分母 | `references/topn/adaptive-evidence-thresholds.md` |\n| 提出配置优化 | 先列证据，再设计单变量、可回滚实验 | `references/topn/recommendation-workflow.md` |\n| 处理 Open API | 显式调用独立的 `$topn-open-api` | 不用分析脚本替代 API 接入 |\n\n## 证据边界\n\n每条关键内容标注信息角色：\n\n- `[文档]`：TopOn 官方帮助中心对产品或口径的说明。\n- `[观测]`：用户上传的报表或用户确认的业务事件。\n- `[计算]`：从观测数据复算的结果。\n- `[推断]`：与证据一致但尚未排除其他解释的原因假设。\n- `[建议]`：拟测试或执行的动作。\n\n只有 `[观测]` 和 `[计算]` 能描述指定数据的当前业务表现。帮助文档、行业经验和历史案例只用于解释指标或提出验证方向。主要结论同时标注 A/B/C/D 级：D 级证据或质量 `blocked` 时停止归因与配置建议；质量 `limited` 时关键结论不超过 C 级。不要设置统一 DAU 门槛，按实际分母、历史噪声、完整窗口和业务最小变化判断证据强度。\n\n## 一键处理报表\n\n支持 CSV、TSV、XLSX 和 XLSM。默认币种为 USD、报表统计时区为 UTC+0；项目约定不同则显式覆盖。现实业务数据使用 `observed`，明确只作字段或流程样例的文件使用 `fixture`；fixture 证据固定为 D，不得形成现实归因或具体配置建议。\n\n在 Skill 根目录运行：\n\n```powershell\npython scripts/topn/run_topn_analysis.py \u003c报表或目录\u003e --project \u003c项目名\u003e --trust-status observed --surface report\n```\n\n入口依次完成：\n\n1. 识别综合、漏斗或聚合管理报表。\n2. 映射中文列名到规范字段，并写入指标定义和公式。\n3. 隔离合计行、小计行和混合粒度。\n4. 生成 Data Analytics artifact。\n5. 检查完整性、唯一性、有效性、一致性、时间连续性和公式复算。\n6. 评估 7、14、28、56 日自适应证据窗口。\n7. 输出 `analysis-manifest.json`，声明后续 Data Analytics 路由。\n\n单独检查结构：\n\n```powershell\npython scripts/topn/inspect_topon_report.py \u003creport.xlsx\u003e --output \u003cinspection.json\u003e\n```\n\n字段无法自动识别时，用脚本的 `--mapping` 提供 `规范字段 -\u003e 原始列名` JSON，不让分析工具猜列名或粒度。保留原始文件，清洗和字段映射写入分析目录的 `derived/`。\n\n## 字段硬约束\n\n- `estimated_revenue` 是 TopOn 预估收益；`revenue_api` 是第三方广告平台报表 API 收益，两者只做对账。\n- `impressions` 是 TopOn SDK 展示回调；`impressions_api` 是第三方广告平台报表展示。\n- `estimated_ecpm = estimated_revenue / impressions * 1000`；`estimated_arpdau = estimated_revenue / dau`。\n- `estimated_revenue_share = estimated_revenue / report_total_estimated_revenue`；`impression_share = impressions / report_total_impressions`。\n- `bidding_response_rate = bid_responses / bidding_requests`；`bidding_win_rate = bidding_wins / (bidding_requests * bidding_response_rate)`。\n- `ad_ready_rate = ad_ready_at_arrival / ad_scene_arrivals`；`is_ready_success_rate = is_ready_true_results / is_ready_queries`。\n- `impression_rate = impressions / fills_at_current_grain`；`impression_success_rate = impressions / display_trigger_successes`。\n\n比率、eCPM、ARPDAU 和人均次数从规范分子分母重算，不平均行级比率。DAU、DEU、留存率、ARPU、ARPDAU、eCPM 和各类比率不能跨重复粒度直接求和。漏斗的 `event_count`、`device_count`、`per_device` 分开分析；聚合管理报表首行 `Total` 的请求是流量请求，广告源明细的请求是广告源请求，不能混合。\n\n常规综合报表不足以直接推导瀑布层数或底价。配置定位至少需要地区、广告位、广告源、广告场景、流量分组或版本中的一个可行动维度；若要讨论层级或底价，还需 `source_instance`、`layer_order`、`floor_price`、`bidding_type`、`timeout_ms`、`latency_ms` 和 `config_effective_at` 等字段。缺字段时只能定位候选对象，不能给出确定参数。\n\n## Data Analytics 联动\n\n现实数据分析必须先读取一键入口生成的 `data-quality.json` 和 `evidence-evaluation.json`，再把 `data-analytics-artifact.json` 交给 Data Analytics：\n\n- 质量问题走 `analyze-data-quality`。\n- 指标变化走 `metric-diagnostics`。\n- 策略取舍走 `product-business-analysis`。\n- 需要交付报告走 `build-report`。\n\n质量 `blocked`、fixture 数据或 D 级证据时停止归因与配置建议。质量 `limited` 时，关键结论不得超过 C 级。artifact 的规范字段、定义、公式和聚合规则必须来自 `references/topn/metric-catalog.json`；生成或发布前完成 artifact 校验。\n\n## 帮助中心检索\n\n构建时已将 TopOn 中文帮助中心正文保存为去除图片语法的本地 Markdown 快照。运行时优先使用本地快照，不依赖网络；需要核对时通过公开来源注册表打开官方 URL。检索命令：\n\n```powershell\npython scripts/topn/search_topon_docs.py \"查询词\" --limit 8\n```\n\n命中结果会返回中文标题、栏目、官方 URL 和本地正文片段。帮助文档只用于产品概况、指标定义和操作理解，不用于推断当前竞价环境、广告主预算或广告源实时表现。\n\n## 策略建议与实验\n\n建议按“观察、证据、假设、替代解释、动作、范围、主要指标、护栏指标、决策条件”表达。根据定位选择动作：\n\n- 请求量问题：检查产品触发、频控、场景覆盖和版本行为。\n- 填充问题：检查广告源状态、地区覆盖、竞价参与、瀑布和底价。\n- 展示转化问题：检查加载时机、缓存、超时、展示条件和用户离开。\n- eCPM 问题：先控制流量结构，再检查同细分单元的广告源和竞价配置。\n- 单一广告源问题：查看增量收入贡献和替代广告源承接，不只看该广告源 eCPM。\n\n默认采用完整自然日、等长窗口、单变量、小流量、可回滚实验；预先定义主要指标、体验护栏、最小可接受变化、观察窗口、样本量、SRM 检查、扩大条件和回滚条件。不要从行业经验直接给出通用最优底价、瀑布层数、并发请求数或广告频次。默认只输出建议，不修改线上配置。\n\n## 项目状态\n\n需要长期迭代时运行：\n\n```powershell\npython scripts/topn/init_topon_project.py \u003cproject\u003e\n```\n\n项目数据保存在 `output/folder/topn-analysis/\u003cproject\u003e/`。不要把用户报表、原始响应、密钥或分析产物复制进 Skill 目录或发布仓库。\n\n## 交付格式\n\n报告写明分析对象、数据范围、粒度、币种、时区、来源、预估/结算口径、质量状态、证据等级、主要发现、贡献拆解、原因假设、替代解释、限制、建议实验和官方文档链接；把“发生了什么”和“为什么发生”分开。百分比同时给分子和分母，或给当前值与基线值，并区分绝对变化和相对变化。\n"},{"id":"topn-data-contract","path":"references/topn/data-contract.md","title":"TopOn 数据约定","group":"TopOn 分析","tag":"TopOn","description":"报表类型、指标语义、可加性、粒度和数据质量规则","kind":"topn","lines":153,"headings":["TopOn 分析数据约定","已登记报表类型","推荐粒度","帮助中心语义层","可加指标","派生指标","非可加指标","最小数据集","数据质量规则","Data Analytics 交接约定","瀑布和底价优化补充字段"],"content":"# TopOn 分析数据约定\n\n## 已登记报表类型\n\n详细字段指纹见 `report-types.json`。\n\n| 报表类型 | 典型结构 | 分析前处理 |\n|---|---|---|\n| 综合报表 | 通常一行对应一个日期及当前筛选维度组合 | 隔离首行区间汇总；比率、eCPM、DAU、DEU 和 ARPDAU 不直接求和 |\n| 漏斗报表 | 同一日期按次数、设备、人均次数等统计方式拆成多行 | 必须按统计方式分层；不同统计方式严禁相加，使用专用漏斗分析器 |\n| 聚合管理报表 | 首行 Total 加广告源明细 | 隔离 Total；区分流量请求与广告源请求，并检查第三方广告位 ID 复用 |\n\n用户明确标为结构样例或低可信数据的文件，只用于字段映射、粒度识别和流程测试，不得据此评价业务或生成具体配置建议。\n\n## 推荐粒度\n\n一行表示一个日期下唯一的维度组合。优先保留以下维度：\n\n| 类别 | 字段 |\n|---|---|\n| 时间 | `date`、时区 |\n| 产品 | `app`、`app_id`、`platform`、`app_version` |\n| 流量 | `country`、渠道、用户分层 |\n| 广告 | `ad_unit`、`ad_unit_id`、`ad_format`、场景 |\n| 聚合 | `network`、`ad_source`、`ad_source_id`、`third_party_ad_unit_id`、`traffic_group`、`waterfall`、竞价类型 |\n| 配置 | 广告源实例/ID、层级顺序、底价、竞价类型、超时、延迟、配置生效时间 |\n| 口径 | `currency`、`data_source`、预估或结算标记 |\n\n脚本内置常见中英文字段别名。自动映射失败时，传入 `canonical_field -\u003e source_column` JSON。\n\n## 帮助中心语义层\n\n机器可读的完整字段目录位于 `metric-catalog.json`。Data Analytics 只使用目录中的规范字段名、定义、公式和聚合规则；原始中文列名只用于映射和展示。\n\n| TopOn 列名 | 规范字段 | 口径 |\n|---|---|---|\n| 预估收益 | `estimated_revenue` | TopOn 根据 SDK 展示和价格估算，不是第三方结算收益 |\n| 收益 API | `revenue_api` | 第三方广告平台报表 API 收益 |\n| 预估 eCPM | `estimated_ecpm` | `estimated_revenue / impressions * 1000` |\n| 展示 | `impressions` | TopOn 收到广告平台 SDK 展示成功回调后统计 |\n| 展示 API | `impressions_api` | 第三方广告平台报表 API 曝光数 |\n| 收益 GAP | `revenue_gap_rate` | `(estimated_revenue - revenue_api) / revenue_api` |\n| 展示 Gap | `impression_gap_rate` | `(impressions - impressions_api) / impressions_api` |\n| 统计方式 | `statistic_type` | `event_count`、`device_count` 或 `per_device` |\n| 广告平台 | `network` | 第三方广告平台，不等于广告源 |\n| 广告源 | `ad_source` | TopOn 广告源名称，与 `ad_source_id` 配套 |\n| 竞价胜出数 | `bidding_wins` | 瀑布流中的竞价胜出次数 |\n| 竞胜率 | `bidding_win_rate` | `bidding_wins / (bidding_requests * bidding_response_rate)` |\n\n`预估收益占比 = 预估收益 / 汇总预估收益`，`展示占比 = 展示数 / 汇总展示数`。标准化脚本优先读取导出汇总行作为分母；汇总行缺失时，只有在明细粒度互斥且覆盖同一筛选范围时才允许求和重建分母。\n\n`新用户占比 = 新增用户 / DAU`；`竞价响应率 = 竞价响应次数 / 竞价次数`；`广告源填充率 = 广告源返回成功数 / 广告源请求数`；`广告 Ready 率 = 到达场景时已有缓存广告可播放数 / 到达广告场景数`；`isReady 成功率 = isReady 返回 True 次数 / isReady 调用次数`；`展示率 = 展示数 / 当前粒度填充数`。当前导出没有这些指标的全部原始分子、分母，因此定义已确认，但仍不能独立复算。\n\n“展示成功率”的当前确认公式为 `展示 / 触发展示成功`。它表示成功触发第三方平台展示后，实际收到第三方平台展示成功回调的比例。用户于 2026-07-21 确认该口径，样例 14 个日期也全部复算一致；本地帮助中心快照中的旧公式不再作为当前分析口径。\n\n聚合管理报表中，Total 行的“请求”是流量请求，广告源明细行的“请求”是广告源请求。两者不能相加或直接比较。若同一 `third_party_ad_unit_id` 出现在多个明细行，收益 API、展示 API 等第三方数据可能重复，汇总前必须去重或改用导出 Total。\n\n## 可加指标\n\n同一互斥粒度内可以求和：\n\n- `requests`：请求数。\n- `responses`：返回或填充数。先确认导出口径。\n- `impressions`：展示数。\n- `clicks`：点击数。\n- `estimated_revenue`：TopOn 预估收益。同币种、互斥粒度内可加。\n- `revenue_api`：第三方平台 API 收益。同币种且 API 支持当前维度时可加。\n- `revenue`：只用于已明确来源的一般收入字段。不得把“预估收益”自动放入此字段。\n\n## 派生指标\n\n从汇总后的分子、分母计算：\n\n```text\ntraffic_fill_rate            = traffic_fills / traffic_requests\nad_source_fill_rate          = ad_source_fills / ad_source_requests\ndisplay_trigger_success_rate = display_trigger_successes / display_triggers\nimpression_success_rate      = impressions / display_triggers\nctr                          = clicks / impressions\nestimated_ecpm               = estimated_revenue / impressions * 1000\nestimated_arpdau             = estimated_revenue / dau\nrevenue_gap_rate             = (estimated_revenue - revenue_api) / revenue_api\nimpression_gap_rate          = (impressions - impressions_api) / impressions_api\n```\n\n若 TopOn 文档对具体报表使用不同定义，以对应页面为准，并在报告中写出公式。\n\n广告场景到达率使用设备口径：`ad_scene_arrivals / app_starts`。广告触发率使用次数口径：`display_triggers / ad_scene_arrivals`。漏斗报表中的比率应在目录指定的统计方式内复算，不能跨“次数、设备、人均次数”取分子和分母。\n\n## 非可加指标\n\nDAU、广告用户数、留存率、ARPU、ARPDAU、eCPM 和各类比率不能跨重复粒度直接求和。计算 ARPDAU 前，先取得按日期和应用去重后的 DAU。无法确认重复方式时，保留原值并报告限制。\n\n## 最小数据集\n\n收入变化诊断至少需要：\n\n```text\ndate, revenue, impressions\n```\n\n漏斗诊断再增加：\n\n```text\nrequests, responses\n```\n\n配置定位至少增加一个可操作维度：\n\n```text\ncountry, ad_unit, network, traffic_group, platform, app_version\n```\n\n## 数据质量规则\n\n- 记录币种、时区、导出时间和数据来源。\n- TopOn 界面和导出中的 `$` 默认解释为美元（USD）；如项目另有币种约定，必须显式覆盖默认值。\n- TopOn 报表统计时区默认解释为 UTC+0；如导出或项目另有时区约定，必须显式覆盖默认值。\n- 检查重复行、合计行和小计行。\n- 检查负收入、负请求、展示大于返回等异常，但不要在不知道口径时自动删除。\n- 检查对比周期是否完整，避免用未结束当天对比完整日。\n- 保留原始文件；清洗和字段映射写入 `derived/`。\n- 对账时并列展示不同来源，不先强行合并。\n- 多币种收入必须先按明确汇率和日期换算；多时区数据必须先统一统计日。\n- 广告位请求与广告源请求属于不同漏斗层级。广告源请求可能是同一次瀑布请求中的多次尝试，不能跨广告源相加成广告位请求。\n- 当前周期和基线周期必须覆盖相同数量的完整自然日；默认排除尚未结束的当天。\n- 第三方平台 Report API 指标存在更新延迟。帮助中心说明 UTC+8/UTC+0 通常延迟 1 天，UTC-8 通常延迟 2 天；近期 `收益 API`、`展示 API` 和 GAP 指标必须先确认完成度。\n- 只有日期的报表能看趋势，不能定位配置对象。配置建议至少需要地区、广告位、广告源、广告场景、流量分组或版本中的一个可行动维度。\n- 导出收益和比率可能已按展示精度取整。公式复算出现小差异时保留差异，并区分“显示取整或隐藏精度”与“公式定义冲突”。\n\n## Data Analytics 交接约定\n\n- 先生成 `normalized_comprehensive.csv` 或 `normalized_funnel.csv`，再生成 `artifact.json`。\n- snapshot 中每个 dataset 都是行对象数组，单个数据集不超过 2,000 行。\n- `source.query.sql` 必须是可执行的 DuckDB SQL，并指向标准化 CSV。\n- `source.query.metric_definitions` 必须来自 `metric-catalog.json`，包含定义、聚合规则和已确认公式。\n- 综合报表保留一份规范数据集。漏斗报表拆成 `event_count`、`device_count`、`per_device` 三份数据集。\n- artifact 继承 `observed` 或 `fixture` 信任状态；状态为 `fixture` 时禁止业务归因和配置建议。\n- 调用 Data Analytics 的 `validate_artifact` 通过后，才能渲染或发布。\n\n主要定义来源：**[IAA-TOPON-20-综合报表]** **[IAA-TOPON-08-漏斗分析]** **[IAA-TOPON-10-有效展示]** **[IAA-TOPON-21-Open API 综合报表]**。\n\n## 瀑布和底价优化补充字段\n\n常规综合报表不足以直接推导瀑布层数或底价。至少补充：\n\n```text\nsource_instance, source_instance_id, layer_order, floor_price,\nbidding_type, timeout_ms, latency_ms, config_effective_at\n```\n\n若能取得逐次请求或广告源实例级数据，再保留请求尝试、返回价格、是否展示和超时状态。没有这些字段时，只能定位候选广告位或广告源，不能把建议写成确定参数。\n"},{"id":"topn-metrics-and-diagnostics","path":"references/topn/metrics-and-diagnostics.md","title":"TopOn 指标拆解与诊断","group":"TopOn 分析","tag":"TopOn","description":"收入、展示、eCPM、请求到展示漏斗和维度贡献拆解","kind":"topn","lines":64,"headings":["指标拆解与诊断路径","收入拆解","请求到展示漏斗","eCPM 变化","维度贡献","同期事件","数据不足时的输出"],"content":"# 指标拆解与诊断路径\n\n## 收入拆解\n\n先使用恒等关系定位变化来自规模还是价格：\n\n```text\nrevenue = impressions × ecpm / 1000\n```\n\n比较当前周期与基线周期，并分别计算展示量和 eCPM 的变化。两者同时变化时，继续按国家、广告位、广告样式、广告源、版本和流量分组做贡献拆解。\n\n不要只看相对变化。报告当前值、基线值、绝对变化、相对变化和对总收入差额的贡献。\n\n## 请求到展示漏斗\n\n在字段口径允许时使用：\n\n```text\nrequests -\u003e responses -\u003e impressions -\u003e clicks\n```\n\n依次检查：\n\n1. 请求量是否随活跃用户、场景触发或版本变化。\n2. 返回或填充是否变化，以及变化集中在哪个国家、广告位或广告源。\n3. 返回到展示的转化是否变化，检查超时、缓存、预加载、用户离开和展示条件。\n4. 点击变化是否来自展示规模、素材或误触，不以 CTR 单独判断收入质量。\n\n## eCPM 变化\n\n将 eCPM 变化作为结果，优先排查流量结构：国家、平台、广告样式、用户价值、广告位和广告源占比。结构变化后再检查同一细分单元的 eCPM 是否变化。\n\n候选原因包括竞价环境、底价、瀑布配置、广告源预算、隐私授权和流量质量。除非有配置记录、广告源反馈或实验数据，否则只标为 `[推断]`。\n\n## 维度贡献\n\n对每个维度计算：\n\n```text\ngroup_revenue_delta = current_group_revenue - previous_group_revenue\n```\n\n按绝对贡献排序。先解释少数主导变化，再处理长尾。维度之间可能重叠，国家贡献和广告位贡献不能相加为新的总变化。\n\n对同一维度使用对称恒等拆分，将收入差额描述为展示量/结构效应与组内 eCPM 效应。该拆分用于缩小排查范围，不代表展示或 eCPM 变化的因果来源。每个维度的分组收入差额之和必须与总收入差额对账。\n\n## 同期事件\n\n把以下事件与时间线对齐：\n\n- App 版本发布、SDK 或 Adapter 更新。\n- 广告位触发、频控、预加载和展示逻辑修改。\n- TopOn 流量分组、瀑布、竞价、底价或广告源启停。\n- 用户获取渠道、国家结构或投放规模变化。\n- CMP、ATT、GDPR 或其他合规流程变化。\n- 节假日、广告平台事故、报表延迟和币种换算变化。\n\n时间重合只能增加假设优先级，不能证明因果。\n\n## 数据不足时的输出\n\n列出当前能确认的变化，然后给最小补数清单。例如：缺少 `responses` 时可以确认展示下降，但不能区分填充下降和展示转化下降；缺少版本维度时不能验证发布影响。\n"},{"id":"topn-adaptive-evidence-thresholds","path":"references/topn/adaptive-evidence-thresholds.md","title":"TopOn 自适应证据门槛","group":"TopOn 分析","tag":"TopOn","description":"窗口选择、样本量、历史噪声和证据等级评估","kind":"topn","lines":90,"headings":["自适应证据门槛","核心原则","分析前置条件","自动选择观察窗口","按指标计算不确定性","计数指标","比率指标","收益、eCPM 和 ARPDAU","维度拆分","变化判定","异常检测","实验门槛","输出要求"],"content":"# 自适应证据门槛\n\n## 核心原则\n\n不用统一 DAU 门槛判断数据是否可分析。按指标实际分母、历史波动、观察窗口、维度粒度和业务影响决定结论强度。DAU 只用于描述项目规模和选择观察周期。\n\n同一项目可以同时出现不同置信度：DAU 趋势可信，某个小广告源的竞胜率仍可能不可判断；日活只有几十，但每天产生数千次广告请求时，请求填充率也可能有足够证据。\n\n## 分析前置条件\n\n以下任一条件不满足时，停止统计判断并先处理数据问题：\n\n1. 日期、时区、币种和数据来源明确。\n2. 对比周期的字段口径与维度粒度一致。\n3. 比率能取得分子、分母，或明确标记为平台直接返回且不可复算。\n4. 缺失、接口未返回和真实零值能够区分。\n5. 汇总行、明细行和非可加指标没有重复聚合。\n\n## 自动选择观察窗口\n\n从完整自然日的 7 天对 7 天开始，保持星期结构一致。证据不足时依次扩展为 14、28、56 天；达到可用等级后停止扩展。\n\n- 日活和事件量稳定：优先 7 天或 14 天。\n- 日活几十到几百且波动大：优先 28 天或 56 天，并以周为最小展示单位。\n- 新用户、留存和 LTV：按 cohort 成熟度选择窗口，不把尚未成熟的 D7、D30、D60 当作完整数据。\n- 版本发布、节假日或投放变化导致周期不可比：不用扩大窗口掩盖结构变化，改做事件前后分段。\n\n若 56 天仍不足，将结论降为“描述性观察”，不继续通过扩大窗口制造稳定表象。\n\n## 按指标计算不确定性\n\n### 计数指标\n\n对展示、点击、请求、填充和竞价次数使用实际事件数评估误差。事件稀少或过度离散时，使用 bootstrap 或负二项分布，不只依赖泊松假设。\n\n### 比率指标\n\n对填充率、展示率、CTR、竞价响应率、竞胜率、Ready 率和留存率使用原始分子、分母计算 Wilson 或 Beta 区间。不能只根据 DAU 或平台返回的百分比判断稳定性。\n\n### 收益、eCPM 和 ARPDAU\n\n收益比较同时报告绝对差额、相对变化和对总差额的贡献。eCPM、ARPDAU 等比值指标从原始分子、分母重算，并使用按天的 block bootstrap 或 delta method 估计变化区间。不要平均行级比值。\n\n### 维度拆分\n\n按国家、广告位、广告源、版本或流量分组拆分时，重新评估每个切片的分母和区间。切片不足时向上合并到广告位、广告平台或应用层，并把长尾归入 `Other`。总体可信不代表每个切片可信。\n\n## 变化判定\n\n同时满足统计证据和业务影响才称为“确认变化”：\n\n```text\npractical_threshold = max(用户指定的最小业务影响, 历史同口径噪声上界)\n```\n\n没有用户指定值时，用最近可比历史周期的变化分布估计噪声上界；历史不足时只报告变化区间，不自动给出配置动作。\n\n| 等级 | 判定 | 允许输出 |\n|---|---|---|\n| A 可决策 | 数据质量通过；95% 变化区间不跨 0；超过 practical_threshold；主要替代解释已检查 | 明确诊断，可提出小流量实验和量化决策条件 |\n| B 可行动验证 | 数据质量通过；方向在多个窗口或主要切片中一致，但区间较宽、业务影响接近门槛或仍有重要替代解释 | 标记方向性证据，只建议验证实验 |\n| C 仅观察 | 区间宽、方向不稳定、分母不足、窗口短或关键维度缺失 | 描述现象、合并维度、延长窗口或列补数项 |\n| D 不可用 | 口径冲突、缺页、重复聚合、分子分母错误或周期不可比 | 不做业务结论，先修复数据 |\n\n不要把统计显著等同于收益重要，也不要把绝对变化大等同于原因已经确定。\n\n## 异常检测\n\n使用同星期结构的历史数据建立基线。优先采用滚动中位数、MAD、分位数带和季节性残差，减少小项目极端值对均值和标准差的影响。\n\n- 单日越界：标记异常候选，不直接归因或改配置。\n- 连续两期同向，或对总收益差额贡献集中：提升调查优先级。\n- 多维度同时扫描：控制多重比较，使用 FDR 或只报告预先登记的核心切片。\n- 新项目历史不足：使用宽区间和 C 级输出，随数据积累自动收紧。\n\n## 实验门槛\n\n实验前根据基线方差、目标最小变化和实际流量估算样本量。低流量项目优先延长实验并减少实验组数，不降低成功标准。\n\n只有满足以下条件才允许扩大配置：\n\n1. 主要指标达到预先登记的最小业务影响。\n2. 区间支持预期方向，且结果不是单日或单一异常切片驱动。\n3. 收入、留存、稳定性等护栏未恶化。\n4. 分组比例、版本、地区和广告位结构可比。\n\n## 输出要求\n\n每个主要结论附上：观察窗口、粒度、实际分母、变化区间、practical threshold、证据等级和降级原因。若只能取得日级汇总数据，明确说明区间方法和无法验证的假设。\n"},{"id":"topn-evidence-and-guardrails","path":"references/topn/evidence-and-guardrails.md","title":"TopOn 证据模型与护栏","group":"TopOn 分析","tag":"TopOn","description":"文档、观测、计算、推断、建议的边界与禁止推断","kind":"topn","lines":49,"headings":["证据模型与分析护栏","信息角色","必须执行的检查","禁止推断","处理口述信息","结论置信度"],"content":"# 证据模型与分析护栏\n\n## 信息角色\n\n把输入分成五类，不允许相互替代。\n\n| 标签 | 内容 | 可支持的结论 |\n|---|---|---|\n| `[文档]` | TopOn 帮助中心和接口说明 | 产品能力、字段含义、调用方法、平台约束 |\n| `[观测]` | 上传文件、API 返回、用户确认事件 | 指定对象和时间范围内发生的事实 |\n| `[计算]` | 从观测数据复算的指标和变化 | 变化规模、贡献维度、漏斗位置 |\n| `[推断]` | 与证据一致但未排除其他解释的原因 | 调查方向和实验假设 |\n| `[建议]` | 拟测试或执行的动作 | 后续决策，不构成已证实结论 |\n\n## 必须执行的检查\n\n在分析开始前确认：\n\n1. 数据覆盖的日期、时区和币种。\n2. 数据来自 TopOn SDK 统计、TopOn 三方 API、广告平台结算还是其他系统。\n3. 每行粒度以及应用、国家、广告位、广告源、版本等维度是否互斥。\n4. 收入是否为预估值、结算值或换算值。\n5. 比率能否从原始分子和分母重算。\n6. 对比期间是否包含版本发布、流量采购变化、节假日、合规弹窗或线上事故。\n\n## 禁止推断\n\n- 不根据帮助文档判断用户当前表现好坏。\n- 不使用无来源的行业均值给具体底价、频控、瀑布层数或并发数。\n- 不把相关性写成因果关系。\n- 不把行级 eCPM、填充率或展示率直接求平均。\n- 不把 DAU 等非可加指标跨国家、广告位或广告源求和。\n- 不把 SDK 实时口径与广告平台结算口径混为同一事实。\n- 不把缺失值默认为 0，除非数据定义明确说明。\n\n## 处理口述信息\n\n把用户口述转为结构化上下文：事件时间、影响对象、预期机制、可验证指标和可取得的数据。用户确认的发布记录可以标为 `[观测]`；“可能是某广告源降价”仍标为 `[推断]`。\n\n口述缺少关键范围时，先采用最窄的合理假设并明确写出。若假设会改变配置对象或结论方向，向用户确认。\n\n## 结论置信度\n\n使用“高、中、低”描述证据完整性，不输出伪精确概率。\n\n- 高：原始指标完整，前后周期可比，主要替代解释已排查。\n- 中：方向稳定，但缺少一个重要维度或同期事件信息。\n- 低：样本短、口径不明、只有聚合比率或依赖口述推断。\n"},{"id":"topn-recommendation-workflow","path":"references/topn/recommendation-workflow.md","title":"TopOn 配置建议与实验","group":"TopOn 分析","tag":"TopOn","description":"动作选择、单变量实验、指标护栏和回滚条件","kind":"topn","lines":51,"headings":["配置建议与实验工作流","建议结构","选择动作","实验设计","禁止使用固定最优值","执行权限"],"content":"# 配置建议与实验工作流\n\n## 建议结构\n\n| 字段 | 内容 |\n|---|---|\n| 观察 | 数据中发生了什么 |\n| 证据 | 时间范围、对象、指标和贡献 |\n| 假设 | 建议所依赖的机制 |\n| 替代解释 | 仍未排除的其他原因 |\n| 动作 | 要测试的 TopOn 对象和参数 |\n| 范围 | 国家、应用、广告位、版本、流量比例 |\n| 主要指标 | 收入、eCPM、展示或漏斗指标 |\n| 护栏指标 | 留存、崩溃、启动时长、投诉或其他体验指标 |\n| 决策条件 | 扩大、继续观察或回滚的规则 |\n\n## 选择动作\n\n根据数据定位到可操作层级：\n\n- 请求量问题：检查产品触发、频控、场景覆盖和版本行为。\n- 填充问题：检查广告源状态、国家覆盖、竞价参与、瀑布和底价。\n- 展示转化问题：检查加载时机、缓存、超时、展示条件和用户离开。\n- eCPM 问题：先控制流量结构，再检查同细分单元的广告源和竞价配置。\n- 单一广告源问题：查看增量收入贡献和替代广告源承接，不只看该广告源 eCPM。\n\n所有参数名称和平台限制先从本地 TopOn 文档确认。\n\n## 实验设计\n\n优先执行单变量、小流量、可回滚实验。保持对照组和实验组在日期、国家、版本、广告位和用户层级上可比。预先写明观察窗口，避免看到短期波动后改变成功标准。\n\n如果 TopOn 的分流机制不能保证用户稳定分组，或者同一用户会跨组，先查平台文档并在结论中说明污染风险。\n\n实验开始前处理：\n\n- 使用完整自然日，覆盖可比较的星期结构和数据回补延迟。\n- 预先定义主要指标、护栏指标、最小可接受变化和观察窗口。\n- 根据基线方差与目标变化估算样本量；低流量时延长窗口，不靠单日涨跌决策。\n- 检查实验组与对照组样本比例异常（SRM）和关键维度失衡。\n- 避免持续窥视后提前结束；多组或多指标同时检验时说明多重比较风险。\n- 同时保存配置前快照、实验版本、分组规则和实际生效时间。\n\n## 禁止使用固定最优值\n\n不要从行业经验直接给出通用最优底价、瀑布层数、并发请求数或广告频次。经验可以生成候选范围，但最终参数要由当前国家、广告样式、广告位和用户体验数据验证。\n\n## 执行权限\n\n默认输出建议和实验计划，不修改线上配置。用户要求执行时，重新确认环境、应用、广告位、流量组、参数旧值、参数新值、开始时间和回滚方法。高影响改动优先保存变更前快照。\n"},{"id":"topn-report-output","path":"references/topn/report-output.md","title":"TopOn 分析报告输出","group":"TopOn 分析","tag":"TopOn","description":"分析对象、口径、发现、限制和官方引用的交付结构","kind":"topn","lines":23,"headings":["分析报告输出规范","固定结构","写法","数据不足"],"content":"# 分析报告输出规范\n\n## 固定结构\n\n1. 分析对象：应用、平台、广告位、国家和时间范围。\n2. 数据口径：来源、币种、时区、粒度、预估或结算。\n3. 主要发现：只写能由观测和计算支持的变化。\n4. 贡献拆解：展示量、eCPM、漏斗和主要维度。\n5. 原因假设：按证据强弱排序，并列出替代解释。\n6. 建议与实验：对象、范围、指标、护栏和回滚条件。\n7. 数据限制：缺失字段、不完整周期、重复粒度和口径冲突。\n8. 参考资料：使用过的 TopOn 官方页面 URL。\n\n## 写法\n\n先给结论，再给证据。每个核心句子使用 `[观测]`、`[计算]`、`[推断]` 或 `[建议]`。避免“明显”“一定”“最佳”等超出证据的词。\n\n报告中的百分比同时给分子和分母，或给当前值与基线值。相对变化可能在小基数上失真，应同时显示绝对变化。\n\n## 数据不足\n\n将可以回答、不能回答和需要补充的数据分开。补数清单要具体到字段、粒度、时间范围和来源，不只写“需要更多数据”。\n"},{"id":"topn-report-types","path":"references/topn/report-types.json","title":"TopOn 报表类型登记","group":"TopOn 分析","tag":"TopOn","description":"综合、漏斗和聚合管理报表的字段指纹与分析规则","kind":"topn","lines":47,"headings":[],"content":"{\n  \"version\": 3,\n  \"semantic_reference\": \"metric-catalog.json\",\n  \"report_types\": [\n    {\n      \"id\": \"comprehensive_report\",\n      \"name\": \"综合报表\",\n      \"filename_patterns\": [\"TopOn_综合报表_\", \"综合报表\"],\n      \"required_headers\": [\"日期\", \"预估收益\", \"展示\"],\n      \"signature_headers\": [\n        \"DEU\", \"新用户占比\", \"渗透率\", \"预估收益占比\", \"收益 API\",\n        \"收益GAP\", \"预估ARPDAU\", \"展示/DAU\", \"预估 eCPM\",\n        \"广告源请求\", \"竞价\", \"竞价响应eCPM\", \"竞价响应率\",\n        \"广告源填充率\", \"竞胜率\", \"竞价胜出数\", \"展示 API\", \"展示率\", \"展示占比\"\n      ],\n      \"grain\": \"通常一行对应一个日期及当前筛选维度组合；导出文件可能包含首行区间汇总。\",\n      \"analysis_rule\": \"使用 normalize_comprehensive_report.py 删除或隔离区间汇总行。预估收益映射为 estimated_revenue，收益 API 映射为 revenue_api；DAU、DEU、ARPDAU、eCPM 和比率不可跨重复维度直接求和。\"\n    },\n    {\n      \"id\": \"funnel_report\",\n      \"name\": \"漏斗报表\",\n      \"filename_patterns\": [\"TopOn_漏斗报表_\", \"漏斗报表\"],\n      \"required_headers\": [\"日期\", \"统计方式\", \"流量请求\", \"流量填充\", \"展示\"],\n      \"signature_headers\": [\n        \"应用启动\", \"获取配置\", \"流量填充率\", \"到达广告场景\",\n        \"广告场景到达率\", \"广告ready率\", \"查询isReady\", \"isReady成功率\",\n        \"触发展示\", \"广告触发率\", \"触发展示成功\", \"触发展示成功率\",\n        \"展示成功率\", \"展示API\", \"展示Gap\", \"点击率\"\n      ],\n      \"grain\": \"同一日期通常按统计方式拆成次数、设备、人均次数等多行，并可能包含对应的汇总行。\",\n      \"analysis_rule\": \"使用 analyze_funnel_report.py。不同统计方式不可相加；输出 event_count、device_count、per_device 独立数据集。次数口径用于事件漏斗，设备口径用于用户覆盖，人均次数属于非可加均值。\"\n    },\n    {\n      \"id\": \"mediation_management_report\",\n      \"name\": \"聚合管理报表\",\n      \"filename_patterns\": [\"TopOn_聚合管理_\", \"聚合管理\"],\n      \"required_headers\": [\"广告平台\", \"广告源ID\", \"广告源\", \"请求\", \"展示\"],\n      \"signature_headers\": [\n        \"第三方平台广告位ID\", \"状态\", \"价格\", \"eCPM API\", \"预估 eCPM\",\n        \"请求/竞价\", \"填充率\", \"填充耗时（秒）\", \"收益API\", \"展示API\"\n      ],\n      \"grain\": \"一行通常对应一个 TopOn 广告源；首行 Total 为当前聚合范围汇总。广告源行的请求是广告源请求，汇总行的请求是流量请求。\",\n      \"analysis_rule\": \"使用 normalize_mediation_management_report.py。先隔离 Total 汇总行；广告源请求不可跨瀑布层简单解释为流量请求，API 指标在复用第三方广告位ID或存在多分组时可能重复。\"\n    }\n  ]\n}\n"},{"id":"topn-metric-catalog","path":"references/topn/metric-catalog.json","title":"TopOn 指标目录","group":"TopOn 分析","tag":"TopOn","description":"规范字段、定义、公式、来源和聚合规则","kind":"topn","lines":776,"headings":[],"content":"{\n  \"version\": 1,\n  \"language\": \"zh-CN\",\n  \"purpose\": \"把 TopOn 导出列转换为 Data Analytics 可稳定理解的规范字段、定义、公式和聚合规则。\",\n  \"source_precedence\": [\n    \"https://help.toponad.net/cn/docs/DVM3Tf\",\n    \"https://help.toponad.net/cn/docs/qlHqYM\",\n    \"https://help.toponad.net/cn/docs/5e6DnV\",\n    \"https://help.toponad.net/cn/docs/dukFyc\"\n  ],\n  \"global_rules\": [\n    \"带 API 后缀的指标来自第三方广告平台报表 API；没有 API 后缀且非收益的指标通常来自 TopOn SDK 统计。\",\n    \"预估收益与预估 eCPM 是 TopOn 估算口径，不等同于第三方广告平台 API 收益或实际 eCPM。\",\n    \"次数、设备数、人均次数属于不同统计方式，不得相加或放在同一个分母体系内计算。\",\n    \"比率、eCPM、ARPDAU、人均次数和独立用户数必须按定义重算或保留原粒度，不得做行级简单平均。\"\n  ],\n  \"metrics\": {\n    \"date\": {\n      \"source_columns\": [\"日期\"],\n      \"display_name\": \"日期\",\n      \"semantic_name_en\": \"report_date\",\n      \"kind\": \"dimension\",\n      \"data_type\": \"date\",\n      \"aggregation\": \"none\",\n      \"definition\": \"数据产生的统计日期或时间段。\",\n      \"documentation_status\": \"documented\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/DVM3Tf\"]\n    },\n    \"statistic_type\": {\n      \"source_columns\": [\"统计方式\"],\n      \"display_name\": \"统计方式\",\n      \"semantic_name_en\": \"funnel_statistic_type\",\n      \"kind\": \"dimension\",\n      \"data_type\": \"string\",\n      \"aggregation\": \"none\",\n      \"definition\": \"漏斗事件的统计口径：次数按事件发生次数，设备按发生事件的设备数，人均次数为次数除以设备数。\",\n      \"documentation_status\": \"documented\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/qlHqYM\"]\n    },\n    \"dau\": {\n      \"source_columns\": [\"DAU\"],\n      \"display_name\": \"DAU\",\n      \"semantic_name_en\": \"daily_active_users\",\n      \"kind\": \"metric\",\n      \"data_type\": \"number\",\n      \"unit\": \"devices\",\n      \"aggregation\": \"non_additive_distinct_users\",\n      \"definition\": \"每天打开应用并初始化 TopOn SDK 的独立设备用户数；不同筛选维度下代表相应范围的活跃用户，汇总行可能不去重。\",\n      \"documentation_status\": \"documented\",\n      \"sources\": [\"https://help.toponad.net/cn/docs/DVM3Tf\", \"https://help.toponad.net/cn/docs/5e6DnV\"]\n    },\n    \"deu\": {\n      \"source_columns\": [\"DEU\"],\n      \"display_name\": \"DEU\",\n      \"semantic_name_en\": \"daily_engaged_ad_users\",\n      \"kind\": \"metric\",\n      \"data_type\": \"number\",\n      \"unit\": \"devices\",\n      \"aggregation\": \"non_additive_distinct_users\",\n      \"definition\": \"每天展示过广告的独立设备用户数；数值随筛选维度变化。\",\n      \"documentation_status\": \"documented\",\n      \"sources\": [\"https://help.toponad.net/cn/doc
