  <text x="671" y="318" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">9.3%</text>
  <rect x="860" y="290" width="357" height="44" rx="22" fill="#F05A00"/>
  <text x="1039" y="318" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">24.0%</text>

