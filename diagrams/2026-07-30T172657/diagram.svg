  <rect x="406" y="530" width="334" height="44" rx="22" fill="#2F67E8"/>
  <text x="573" y="558" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">22.5%</text>
  <rect x="860" y="530" width="101" height="44" rx="22" fill="#F05A00"/>
  <text x="911" y="558" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">6.8%</text>

