  <!-- Axis labels -->
  <text x="740" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">0%</text>
  <text x="591" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">10%</text>
  <text x="443" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">20%</text>
  <text x="294" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">30%</text>
  <text x="220" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">35%</text>
  <text x="860" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">0%</text>
  <text x="1009" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">10%</text>
  <text x="1157" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">20%</text>
  <text x="1306" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">30%</text>
  <text x="1380" y="244" text-anchor="middle" fill="#98A2B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">35%</text>

  <!-- Vertical grid -->
  <g stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="220" y1="262" x2="220" y2="708"/>
    <line x1="294" y1="262" x2="294" y2="708"/>
    <line x1="443" y1="262" x2="443" y2="708"/>
    <line x1="591" y1="262" x2="591" y2="708"/>
    <line x1="740" y1="262" x2="740" y2="708"/>
    <line x1="860" y1="262" x2="860" y2="708"/>
    <line x1="1009" y1="262" x2="1009" y2="708"/>
    <line x1="1157" y1="262" x2="1157" y2="708"/>
    <line x1="1306" y1="262" x2="1306" y2="708"/>
    <line x1="1380" y1="262" x2="1380" y2="708"/>
  </g>

  <!-- Row separators -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="180" y1="366" x2="1420" y2="366"/>
    <line x1="180" y1="486" x2="1420" y2="486"/>
    <line x1="180" y1="606" x2="1420" y2="606"/>
