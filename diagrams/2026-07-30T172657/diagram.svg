  <text x="800" y="442" text-anchor="middle" fill="#182230" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">IN</text>
  <rect x="238" y="410" width="502" height="44" rx="22" fill="#2F67E8"/>
  <text x="489" y="438" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">33.8%</text>
  <rect x="860" y="410" width="79" height="44" rx="22" fill="#F05A00"/>
  <text x="900" y="438" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">5.3%</text>

