  <text x="630" y="678" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">14.8%</text>
  <rect x="860" y="650" width="321" height="44" rx="22" fill="#F05A00"/>
  <text x="1021" y="678" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">21.6%</text>

  <!-- Compact methodology note: 30px after final row -->
  <rect x="220" y="724" width="1160" height="62" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="250" y="762" fill="#475467" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">IN、拉美、东南亚为可重叠观察组，不与主分层相加；US 为主分层，仅为对照纳入此图。</text>
</svg>



