<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="100" y="78" fill="#182230" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">补充地区组下载与收入偏好</text>
  <text x="100" y="112" fill="#667085" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16">下载侧与收入侧的 Top5 国家地区份额结构 · 单位：%</text>
  <line x1="100" y1="142" x2="1500" y2="142" stroke="#E5E7EB" stroke-width="2"/>

