  <path d="M80 786 C80 766 96 750 116 750 H1484 C1504 750 1520 766 1520 786 V870 C1520 890 1504 906 1484 906 H116 C96 906 80 890 80 870 Z" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <circle cx="124" cy="828" r="22" fill="#F97316"/>
  <text x="124" y="835" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">!</text>
  <text x="166" y="815" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#9A3412">口径说明</text>
  <text x="166" y="848" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#7C2D12">IN、拉美、东南亚为可重叠观察组，不与主分层相加；US 为主分层，为便于对照纳入此图。</text>
  <text x="166" y="878" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9A3412">读图要点：下载侧更集中于 IN、拉美；收入侧在 US、东南亚更突出。</text>
