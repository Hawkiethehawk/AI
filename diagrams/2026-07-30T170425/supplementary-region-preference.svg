    <text x="1045" y="274" text-anchor="middle">0%</text><text x="1191" y="274" text-anchor="middle">10%</text><text x="1336" y="274" text-anchor="middle">20%</text><text x="1482" y="274" text-anchor="middle">30%</text><text x="1555" y="274" text-anchor="middle">35%</text>
