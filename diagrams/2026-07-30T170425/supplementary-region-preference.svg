    <rect x="1045" y="672" width="510" height="44" rx="22" fill="#FFF0E8"/>
    <rect x="375" y="672" width="216" height="44" rx="22" fill="#2563EB"/>
    <rect x="1045" y="672" width="315" height="44" rx="22" fill="#EA580C"/>
