<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <rect x="0" y="0" width="1600" height="940" fill="#F7FAFC"/>
  <path d="M80 156 H1520" stroke="#D9E2EC" stroke-width="2"/>
  <circle cx="108" cy="99" r="28" fill="#2563EB"/>
